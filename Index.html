                                                  </div>

                                                  <div className="bg-slate-50 p-6 rounded-2xl border border-slate-100">
                                                      <h4 className="text-base font-black text-slate-700 mb-4 border-b border-slate-200 pb-3 flex items-center gap-2">
                                                          <span className="bg-[#fdf8f1] text-[#C19A6B] px-2 py-0.5 rounded text-xs border border-[#C19A6B]/20">2</span> 
                                                          مرحلة ما بعد استرداد رأس المال <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider mt-1" dir="ltr">(Post-Payback)</span>
                                                      </h4>
                                                      <WaterfallStageInputs
                                                          accent="#C19A6B"
                                                          values={profitDistSettings}
                                                          onChange={(patch) => setProfitDistSettings({...profitDistSettings, ...patch})}
                                                          fields={[
                                                              { key: 'investorPostPaybackShare', label: `أرباح (${funderNameAr})`, className: 'text-emerald-600' },
                                                              { key: 'bwPostPaybackShare', label: 'أرباح بيلد وايز (المطور)', className: 'text-[#C19A6B]' },
                                                              ...(isLandPartner ? [{ key: 'landPartnerPostPaybackShare', label: 'أرباح شريك الأرض (صاحب الأرض)', className: 'text-violet-600' }] : [])
                                                          ]}
                                                      />
                                                  </div>
                                              </div>
                                          </div>
                                      </div>
                                  )}

                                  {/* --- التدفقات النقدية التشغيلية --- */}
                                  {(currentPage === 'op_cashflow' || isPrintingMode) && (
                                      <div className={`space-y-8 fade-in text-right font-sans ${isPrintingMode ? 'pt-10' : ''}`}>
                                          
                                          {/* Top Metrics Cards */}
                                          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                               <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex flex-col items-center justify-center text-center hover:border-[#C19A6B]/50 transition-colors">
                                                  <span className="text-sm font-bold text-slate-500 mb-2">إجمالي الاستثمار (التكاليف)</span>
                                                  <span className="text-2xl font-black text-slate-800">{formatDisplay(profitDistribution.capitalInvestment)}</span>
                                               </div>
                                               <div className="bg-emerald-50 p-6 rounded-2xl border border-emerald-100 shadow-sm flex flex-col items-center justify-center text-center hover:border-emerald-300 transition-colors">
                                                  <span className="text-sm font-bold text-emerald-600 mb-2">نقطة الاسترداد (Payback)</span>
                                                  <div className="text-2xl font-black text-emerald-700 leading-tight">
                                                      <div>{profitDistribution.breakEvenPointAr}</div>
                                                      <div className="text-[10px] uppercase font-bold text-emerald-600/70" dir="ltr">{profitDistribution.breakEvenPointEn}</div>
                                                  </div>
                                               </div>
                                               <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex flex-col items-center justify-center text-center hover:border-[#C19A6B]/50 transition-colors">
                                                  <span className="text-sm font-bold text-slate-500 mb-2">صافي أرباح ({funderNameAr})</span>
                                                  <span className="text-2xl font-black text-emerald-600">{formatDisplay(profitDistribution.totalInvestorProfit)}</span>
                                               </div>
                                               <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex flex-col items-center justify-center text-center hover:border-[#C19A6B]/50 transition-colors">
                                                  <span className="text-sm font-bold text-slate-500 mb-2">صافي أرباح بيلد وايز</span>
                                                  <span className="text-2xl font-black text-[#C19A6B]">{formatDisplay(profitDistribution.totalBwProfit)}</span>
                                               </div>
                                          </div>

                                          {/* بطاقات معدلات النمو السنوي المركب */}
                                          <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                              <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between gap-4 hover:border-[#C19A6B]/50 transition-colors">
                                                  <div className="flex items-center gap-3">
                                                      <div className="p-3 bg-emerald-50 text-emerald-600 rounded-xl shrink-0"><Icon name="trending-up" className="w-5 h-5" /></div>
                                                      <div className="flex flex-col">
                                                          <span className="text-sm font-black text-slate-800">النمو السنوي للإيرادات التأجيرية</span>
                                                          <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider" dir="ltr">Rental Revenue Growth (g)</span>
                                                      </div>
                                                  </div>
                                                  <div className="flex items-center bg-slate-50 border-2 border-slate-200 rounded-xl px-2 w-28 focus-within:border-[#C19A6B] transition-colors print:border-none print:bg-transparent shrink-0">
                                                      <SmartNumericInput isGold={true} value={growthSettings.revenueGrowth} onChange={v => setGrowthSettings({...growthSettings, revenueGrowth: v})} className="w-full text-center font-black text-lg outline-none" decimals={2} />
                                                      <span className="text-slate-400 font-bold">%</span>
                                                  </div>
                                              </div>

                                              <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between gap-4 hover:border-[#C19A6B]/50 transition-colors">
                                                  <div className="flex items-center gap-3">
                                                      <div className="p-3 bg-amber-50 text-amber-600 rounded-xl shrink-0"><Icon name="map" className="w-5 h-5" /></div>
                                                      <div className="flex flex-col">
                                                          <span className="text-sm font-black text-slate-800">النمو السنوي لإيجار الأرض</span>
                                                          <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider" dir="ltr">Land Rent Escalation (g)</span>
                                                      </div>
                                                  </div>
                                                  <div className="flex items-center bg-slate-50 border-2 border-slate-200 rounded-xl px-2 w-28 focus-within:border-[#C19A6B] transition-colors print:border-none print:bg-transparent shrink-0">
                                                      <SmartNumericInput isGold={true} value={growthSettings.landRentGrowth} onChange={v => setGrowthSettings({...growthSettings, landRentGrowth: v})} className="w-full text-center font-black text-lg outline-none" decimals={2} />
                                                      <span className="text-slate-400 font-bold">%</span>
                                                  </div>
                                              </div>

                                              <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between gap-4 hover:border-[#C19A6B]/50 transition-colors">
                                                  <div className="flex items-center gap-3">
                                                      <div className="p-3 bg-rose-50 text-rose-600 rounded-xl shrink-0"><Icon name="receipt" className="w-5 h-5" /></div>
                                                      <div className="flex flex-col">
                                                          <span className="text-sm font-black text-slate-800">النمو السنوي للتكاليف التشغيلية</span>
                                                          <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider" dir="ltr">Operating Cost Growth (g)</span>
                                                      </div>
                                                  </div>
                                                  <div className="flex items-center bg-slate-50 border-2 border-slate-200 rounded-xl px-2 w-28 focus-within:border-[#C19A6B] transition-colors print:border-none print:bg-transparent shrink-0">
                                                      <SmartNumericInput isGold={true} value={growthSettings.opexGrowth} onChange={v => setGrowthSettings({...growthSettings, opexGrowth: v})} className="w-full text-center font-black text-lg outline-none" decimals={2} />
                                                      <span className="text-slate-400 font-bold">%</span>
                                                  </div>
                                              </div>
                                          </div>

                                          <div className="bg-[#fdf8f1] rounded-2xl p-4 border border-[#C19A6B]/20 text-center text-[11px] font-bold text-slate-500">
                                              يُطبَّق النمو المركب على مصفوفة التدفقات وفق معادلة القيمة المستقبلية:
                                              <span className="text-[#C19A6B] font-black mx-2" dir="ltr">FV = PV × (1 + g)<sup>n</sup></span>
                                              حيث (n) رقم السنة بدءاً من صفر في السنة الأولى.
                                          </div>

                                          <div className="bg-white rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden text-right">
                                              <div className="p-5 lg:p-8 border-b bg-[#fdf8f1] flex flex-wrap items-center justify-between gap-3">
                                                  <div className="flex items-center gap-3 text-[#C19A6B] font-black text-base lg:text-xl min-w-0">
                                                      <Icon name="calendar-days" className="w-6 h-6 shrink-0" />
                                                      <span className="truncate">التدفقات النقدية التشغيلية (عبر السنوات)</span>
                                                  </div>
                                                  <button onClick={exportCashFlowExcel} title="تصدير جدول التدفقات النقدية إلى Excel" className={`flex items-center gap-2 px-4 py-2.5 rounded-xl font-black text-sm transition-all shadow-sm shrink-0 print:hidden ${isExcelExported ? 'bg-emerald-500 text-white' : 'bg-emerald-600 text-white hover:bg-emerald-700'}`}>
                                                      <Icon name={isExcelExported ? "check-circle" : "sheet"} className="w-4 h-4 shrink-0" />
                                                      <div className="flex flex-col items-center leading-tight">
                                                          <span>{isExcelExported ? 'تم التصدير' : 'تصدير Excel'}</span>
                                                          <span className="text-[8px] uppercase tracking-wider font-normal opacity-80" dir="ltr">{isExcelExported ? 'Downloaded' : 'Export to Excel'}</span>
                                                      </div>
                                                  </button>
                                              </div>
                                              
                                              <div ref={topScrollRef} onScroll={(e) => handleTopScroll(topScrollRef, tableScrollRef)} className="overflow-x-auto horizontal-scroll bg-slate-50 border-b border-slate-200" dir="rtl">
                                                  <div style={{ width: `${tableScrollWidth}px`, height: '1px' }}></div>
                                              </div>
                                              
                                              <div ref={tableScrollRef} onScroll={(e) => handleTableScroll(topScrollRef, tableScrollRef)} className="overflow-auto horizontal-scroll max-h-[70vh] main-scroll print:max-h-none print:overflow-visible" dir="rtl">
                                                  <table className="w-full text-center border-collapse">
                                                      <thead className="bg-[#f9f3e9] text-[#C19A6B] font-black text-xs sticky top-0 z-40 shadow-sm print:static">
                                                          <tr>
                                                              <th className="p-4 border border-[#C19A6B]/20 bg-[#C19A6B] text-white row-header-ltr min-w-[250px] shadow-[4px_0_10px_rgba(193,154,107,0.2)] print:bg-[#C19A6B] print:text-white print:shadow-none">البند / السنة</th>
                                                              {timeline.map(m => (
                                                                  <th key={m.idx} className="p-3 border border-[#C19A6B]/20 min-w-[100px] text-center print:bg-[#f9f3e9] print:text-[#C19A6B]">{m.label}</th>
                                                              ))}
                                                          </tr>
                                                      </thead>
                                                      <tbody className="bg-white text-sm">
                                                          <tr className="bg-slate-100/50">
                                                              <td colSpan={projectionYears + 1} className="p-3 text-right font-black text-slate-800 row-header-ltr shadow-[4px_0_10px_rgba(0,0,0,0.03)] print:shadow-none">الإيرادات (Revenues)</td>
                                                          </tr>
                                                          {cashFlowItems.filter(i => i.isPositive).map((item, idx) => renderRow(item, idx))}
                                                          <tr className="bg-slate-800 text-white font-black print:bg-slate-200 print:text-slate-900">
                                                              <td className="p-3 text-right row-header-ltr bg-slate-800 shadow-[4px_0_10px_rgba(0,0,0,0.1)] print:shadow-none print:bg-slate-300">إجمالي الإيرادات</td>
                                                              {timeline.map(m => (
                                                                  <td key={m.idx} className="p-3 text-center print:border print:border-slate-300">{formatCashFlow(yearlyTotals.revTotal[m.idx])}</td>
                                                              ))}
                                                          </tr>
                                                          
                                                          <tr className="bg-slate-100/50">
                                                              <td colSpan={projectionYears + 1} className="p-3 text-right font-black text-slate-800 row-header-ltr shadow-[4px_0_10px_rgba(0,0,0,0.03)] print:shadow-none">التكاليف التشغيلية (Expenses)</td>
                                                          </tr>
                                                          {cashFlowItems.filter(i => !i.isPositive && !i.isCapex).map((item, idx) => renderRow(item, idx))}
                                                          <tr className="bg-slate-800 text-white font-black print:bg-slate-200 print:text-slate-900">
                                                              <td className="p-3 text-right row-header-ltr bg-slate-800 shadow-[4px_0_10px_rgba(0,0,0,0.1)] print:shadow-none print:bg-slate-300">إجمالي التكاليف التشغيلية</td>
                                                              {timeline.map(m => (
                                                                  <td key={m.idx} className="p-3 text-center text-rose-300 print:text-rose-600 print:border print:border-slate-300">{formatCashFlow(yearlyTotals.expTotal[m.idx])}</td>
                                                              ))}
                                                          </tr>
                                                          
                                                          <tr className="bg-emerald-600 text-white font-black text-lg print:bg-emerald-100 print:text-emerald-900">
                                                              <td className="p-4 text-right row-header-ltr bg-emerald-600 shadow-[4px_0_10px_rgba(0,0,0,0.1)] print:shadow-none print:bg-emerald-200">صافي الربح التشغيلي (NOI)</td>
                                                              {timeline.map(m => (
                                                                  <td key={m.idx} className="p-4 text-center print:border print:border-emerald-200">{formatCashFlow(yearlyTotals.noi[m.idx])}</td>
                                                              ))}
                                                          </tr>

                                                          {/* إحلال الأصول ثم صافي التدفق النقدي */}
                                                          {cashFlowItems.filter(i => i.isCapex).map((item, idx) => renderRow(item, idx))}

                                                          <tr className="bg-slate-900 text-white font-black text-lg print:bg-slate-200 print:text-slate-900">
                                                              <td className="p-4 text-right row-header-ltr bg-slate-900 shadow-[4px_0_10px_rgba(0,0,0,0.1)] print:shadow-none print:bg-slate-300">
                                                                  صافي التدفق النقدي
                                                                  <span className="block text-[10px] font-bold opacity-60 uppercase tracking-wider" dir="ltr">Net Cash Flow</span>
                                                              </td>
                                                              {timeline.map(m => (
                                                                  <td key={m.idx} className={`p-4 text-center print:border print:border-slate-300 ${yearlyTotals.netProfit[m.idx] >= 0 ? 'text-[#C19A6B]' : 'text-rose-300'}`}>{formatCashFlow(yearlyTotals.netProfit[m.idx])}</td>
                                                              ))}
                                                          </tr>
                                                      </tbody>
                                                  </table>
                                              </div>
                                          </div>
                                          
                                          {/* Profit Distribution Table */}
                                          <div className="bg-white rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden text-right mt-8">
                                              <div className="p-8 border-b bg-[#fdf8f1] flex items-center justify-between">
                                                  <div className="flex items-center gap-3 text-[#C19A6B] font-black text-base lg:text-xl min-w-0">
                                                      <Icon name="pie-chart" className="w-6 h-6 shrink-0" />
                                                      <span className="truncate">توزيع الأرباح والاسترداد (Profit Distribution & Recovery)</span>
                                                  </div>
                                              </div>
                                              
                                              <div ref={topScrollRef2} onScroll={(e) => handleTopScroll(topScrollRef2, tableScrollRef2)} className="overflow-x-auto horizontal-scroll bg-slate-50 border-b border-slate-200" dir="rtl">
                                                  <div style={{ width: `${tableScrollWidth2}px`, height: '1px' }}></div>
                                              </div>
                                              
                                              <div ref={tableScrollRef2} onScroll={(e) => handleTableScroll(topScrollRef2, tableScrollRef2)} className="overflow-auto horizontal-scroll max-h-[50vh] main-scroll print:max-h-none print:overflow-visible" dir="rtl">
                                                  <table className="w-full text-center border-collapse">
                                                      <thead className="bg-[#f9f3e9] text-[#C19A6B] font-black text-xs sticky top-0 z-40 shadow-sm print:static">
                                                          <tr>
                                                              <th className="p-4 border border-[#C19A6B]/20 bg-slate-800 text-white row-header-ltr min-w-[250px] print:bg-slate-300 print:text-slate-800">البيان</th>
                                                              {timeline.map(m => (
                                                                  <th key={m.idx} className="p-3 border border-[#C19A6B]/20 min-w-[100px] text-center print:bg-[#f9f3e9] print:text-[#C19A6B]">{m.label}</th>
                                                              ))}
                                                          </tr>
                                                      </thead>
                                                      <tbody className="bg-white text-sm font-bold">
                                                          <tr className="hover:bg-slate-50 border-b border-slate-100">
                                                              <td className="p-4 text-right row-header-ltr bg-white text-slate-600 shadow-[4px_0_10px_rgba(0,0,0,0.02)] print:shadow-none">صافي الربح التشغيلي (NOI)</td>
                                                              {timeline.map(m => <td key={m.idx} className="p-3 text-slate-800 print:border print:border-slate-200">{formatCashFlow(yearlyTotals.netProfit[m.idx])}</td>)}
                                                          </tr>
                                                          <tr className="hover:bg-slate-50 border-b border-slate-100">
                                                              <td className="p-4 text-right row-header-ltr bg-white text-blue-600 shadow-[4px_0_10px_rgba(0,0,0,0.02)] print:shadow-none">استرداد رأس المال لـ ({funderNameAr})</td>
                                                              {timeline.map(m => <td key={m.idx} className="p-3 text-blue-600 bg-blue-50/30 print:border print:border-slate-200">{formatCashFlow(profitDistribution.paybackSchedule[m.idx])}</td>)}
                                                          </tr>
                                                          <tr className="hover:bg-slate-50 border-b border-slate-100">
                                                              <td className="p-4 text-right row-header-ltr bg-white text-emerald-600 shadow-[4px_0_10px_rgba(0,0,0,0.02)] print:shadow-none">حصة ({funderNameAr}) من الأرباح</td>
                                                              {timeline.map(m => <td key={m.idx} className="p-3 text-emerald-600 bg-emerald-50/30 print:border print:border-slate-200">{formatCashFlow(profitDistribution.investorProfitShare[m.idx])}</td>)}
                                                          </tr>
                                                          <tr className="hover:bg-slate-50 border-b border-slate-100">
                                                              <td className="p-4 text-right row-header-ltr bg-white text-[#C19A6B] shadow-[4px_0_10px_rgba(0,0,0,0.02)] print:shadow-none">حصة بيلد وايز من الأرباح</td>
                                                              {timeline.map(m => <td key={m.idx} className="p-3 text-[#C19A6B] bg-[#fdf8f1]/50 print:border print:border-slate-200">{formatCashFlow(profitDistribution.bwShare[m.idx])}</td>)}
                                                          </tr>
                                                          {isLandPartner && (
                                                              <tr className="hover:bg-slate-50 border-b border-slate-100">
                                                                  <td className="p-4 text-right row-header-ltr bg-white text-violet-600 shadow-[4px_0_10px_rgba(0,0,0,0.02)] print:shadow-none">حصة شريك الأرض من الأرباح</td>
                                                                  {timeline.map(m => <td key={m.idx} className="p-3 text-violet-600 bg-violet-50/40 print:border print:border-slate-200">{formatCashFlow(profitDistribution.landShare[m.idx])}</td>)}
                                                              </tr>
                                                          )}
                                                      </tbody>
                                                  </table>
                                              </div>
                                          </div>
                                      </div>
                                  )}

                               </div>
                            </div>
                        </main>
                    </div>
                </ErrorBoundary>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
