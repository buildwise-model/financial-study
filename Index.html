                const demolitionAreaVal = costSettings.demolitionArea !== undefined ? safeNum(costSettings.demolitionArea) : safeNum(landAreas.landArea);
                const demolitionDirect = demolitionAreaVal * safeNum(costSettings.demolitionRate);
                
                const totalDirectCost = residentialDirect + basementDirect + softscapeDirect + hardscapeDirect + excavationDirect + demolitionDirect;

                const utilityTotalVal = safeNum(costSettings.utilityTotal);
                const legalTotalVal = safeNum(costSettings.legalTotal);
                const projectMgmtVal = safeNum(costSettings.mgmtTotal);
                const postSalesVal = safeNum(costSettings.postSalesTotal);
                const insuranceTotalVal = safeNum(costSettings.insuranceTotal);

                const furnitureUnits = safeNum(rentSettings.furniturePerUnit) * unitsCount;
                const furnitureAmenities = safeNum(rentSettings.furnitureAmenities);
                const totalFurnishing = furnitureUnits + furnitureAmenities;

                const otherIndirectTotal = (Array.isArray(costSettings.otherIndirect) ? costSettings.otherIndirect : []).reduce((s, o) => s + safeNum(o.value), 0);
                const baseIndirectCost = safeNum(costSettings.feasibilityTotal) + safeNum(costSettings.designTotal) + 
                                         safeNum(costSettings.supervisionTotal) + safeNum(costSettings.permitTotal) + 
                                         (isRent ? 0 : safeNum(costSettings.wafiAccountantTotal)) + insuranceTotalVal + safeNum(costSettings.adsTotal) + 
                                         utilityTotalVal + 
                                         projectMgmtVal + (isRent ? 0 : legalTotalVal) + (isRent ? 0 : postSalesVal) + otherIndirectTotal;
                
                const totalIndirectCost = baseIndirectCost + totalFurnishing;
                const totalConstructionCost = totalDirectCost + totalIndirectCost;
                
                const reserveValue = totalConstructionCost * (safeNum(costSettings.reservePct) / 100);
                const totalDevCostFinal = totalConstructionCost + reserveValue;
                const netProfit = Math.max(0, totalRevenue - totalDevCostFinal);

                const capitalInvestment = totalDevCostFinal;

                return {
                    totalResAreaVal, totalUpperArea,
                    sellableArea, totalBuiltArea, totalServiceArea,
                    unitsCount, derivedAvgUnitSize, residentialSalesRevenue, parkingSalesRevenue, basementServicesRevenue, totalRevenue,
                    totalLandCost,
                    totalDirectCost, residentialDirect, basementDirect, softscapeDirect, hardscapeDirect, excavationDirect, demolitionDirect, demolitionAreaVal,
                    totalIndirectCost, utilityTotalVal, legalTotalVal, projectMgmtVal, postSalesVal, reserveValue, totalConstructionCost, totalDevCostFinal, netProfit,
                    isRent, baseIndirectCost, furnitureUnits, furnitureAmenities, totalFurnishing, annualLandValue, landRentPrice,
                    insuranceTotalVal, wafiAccountantTotal: safeNum(costSettings.wafiAccountantTotal),
                    capitalInvestment
                };
            }, [landAreas, costSettings, rentSettings]);

            const rentCalc = useMemo(() => {
                const units = safeNum(calc.unitsCount);
                const occMap = {
                    optimistic: safeNum(rentSettings.occOptimistic),
                    likely: safeNum(rentSettings.occLikely),
                    pessimistic: safeNum(rentSettings.occPessimistic),
                    custom: safeNum(rentSettings.occCustom)
                };
                const dailyOccMap = {
                    optimistic: safeNum(rentSettings.dailyOccOptimistic),
                    likely: safeNum(rentSettings.dailyOccLikely),
                    pessimistic: safeNum(rentSettings.dailyOccPessimistic),
                    custom: safeNum(rentSettings.dailyOccCustom)
                };
                const monthlyOccMap = {
                    optimistic: safeNum(rentSettings.monthlyOccOptimistic),
                    likely: safeNum(rentSettings.monthlyOccLikely),
                    pessimistic: safeNum(rentSettings.monthlyOccPessimistic),
                    custom: safeNum(rentSettings.monthlyOccCustom)
                };
                const rentMap = {
                    optimistic: safeNum(rentSettings.rentOptimistic),
                    likely: safeNum(rentSettings.rentLikely),
                    pessimistic: safeNum(rentSettings.rentPessimistic),
                    custom: safeNum(rentSettings.rentCustom)
                };
                const dailyRentMap = {
                    optimistic: safeNum(rentSettings.dailyRentOptimistic),
                    likely: safeNum(rentSettings.dailyRentLikely),
                    pessimistic: safeNum(rentSettings.dailyRentPessimistic),
                    custom: safeNum(rentSettings.dailyRentCustom)
                };
                
                const occ = occMap[rentSettings.occScenario] !== undefined ? occMap[rentSettings.occScenario] : occMap.likely;
                const dailyOcc = dailyOccMap[rentSettings.dailyOccScenario] !== undefined ? dailyOccMap[rentSettings.dailyOccScenario] : dailyOccMap.likely;
                const monthlyOcc = monthlyOccMap[rentSettings.monthlyOccScenario] !== undefined ? monthlyOccMap[rentSettings.monthlyOccScenario] : monthlyOccMap.likely;
                const rentPerUnit = rentMap[rentSettings.rentScenario] !== undefined ? rentMap[rentSettings.rentScenario] : rentMap.likely;
                const dailyRentPerUnit = dailyRentMap[rentSettings.dailyRentScenario] !== undefined ? dailyRentMap[rentSettings.dailyRentScenario] : dailyRentMap.likely;
                const monthlyRentPerUnit = rentMap[rentSettings.monthlyRentScenario] !== undefined ? rentMap[rentSettings.monthlyRentScenario] : rentMap.likely;
                const rentalModel = ['daily', 'annual', 'mix'].includes(rentSettings.rentalModel) ? rentSettings.rentalModel : 'mix';
                const requestedDailyUnits = Math.max(0, Math.floor(safeNum(rentSettings.mixDailyUnits)));
                const mixDailyUnits = Math.min(units, requestedDailyUnits);
                const requestedMonthlyUnits = Math.max(0, Math.floor(safeNum(rentSettings.mixMonthlyUnits)));
                const mixMonthlyUnits = Math.min(Math.max(0, units - mixDailyUnits), requestedMonthlyUnits);
                const mixRemainingUnits = Math.max(0, units - mixDailyUnits - mixMonthlyUnits);
                const dailyUnitsForRevenue = rentalModel === 'mix' ? mixDailyUnits : units;
                const monthlyUnitsForRevenue = rentalModel === 'mix' ? mixMonthlyUnits : units;
                const dailyAnnualRent = dailyUnitsForRevenue * dailyRentPerUnit * 365 * ((rentalModel === 'mix' ? dailyOcc : occ) / 100);
                const monthlyAnnualRent = monthlyUnitsForRevenue * monthlyRentPerUnit * ((rentalModel === 'mix' ? monthlyOcc : occ) / 100);
                const annualRent = rentalModel === 'daily'
                    ? dailyAnnualRent
                    : rentalModel === 'annual'
                        ? monthlyAnnualRent
                        : (mixDailyUnits * dailyRentPerUnit * 365 * (dailyOcc / 100)) + (mixMonthlyUnits * monthlyRentPerUnit * (monthlyOcc / 100));
                const otherRevenues = Array.isArray(rentSettings.otherRevenues) ? rentSettings.otherRevenues : [];
                const otherTotal = otherRevenues.reduce((sum, o) => sum + safeNum(o.value), 0);
                const totalRentRevenue = annualRent + otherTotal;

                // متوسط عدد الوحدات المشغولة فعلياً — أساس احتساب المرافق والمستهلكات.
                // في نموذج Mix تُحتسب الوحدات اليومية بنسبة الإشغال اليومي والوحدات
                // السنوية بنسبة الإشغال السنوي، والوحدات غير المؤجرة لا تستهلك شيئاً.
                const occupiedUnits = rentalModel === 'mix'
                    ? (mixDailyUnits * (dailyOcc / 100)) + (mixMonthlyUnits * (monthlyOcc / 100))
                    : units * (occ / 100);
                // نسبة الإشغال الفعلية المكافئة على مستوى المشروع
                const effectiveOcc = units > 0 ? (occupiedUnits / units) * 100 : 0;

                return { units, occ, dailyOcc, monthlyOcc, rentPerUnit, dailyRentPerUnit, monthlyRentPerUnit, dailyAnnualRent, monthlyAnnualRent, rentalModel, mixDailyUnits, mixMonthlyUnits, mixRemainingUnits, annualRent, otherTotal, totalRentRevenue, occupiedUnits, effectiveOcc };
            }, [rentSettings, calc]);

            const opCalc = useMemo(() => {
                const units = safeNum(calc.unitsCount);
                const occ = safeNum(rentCalc.occ) / 100;
                const employees = Array.isArray(opCostSettings.employees) ? opCostSettings.employees : [];
                
                // نظام الإدارة: 'self' إدارة ذاتية | 'operator' مشغل خارجي
                const isExternalOperator = opCostSettings.managementMode === 'operator';

                const payrollGross = employees.reduce((s, e) => s + ((safeNum(e.qty) * safeNum(e.salary)) + safeNum(e.addl)) * 12, 0);
                const payrollAnnual = isExternalOperator ? 0 : payrollGross;

                // أتعاب المشغل الخارجي = نسبة من إجمالي الإيرادات + رسوم ثابتة (إن وجدت)
                const operatorFeePct = safeNum(opCostSettings.operatorFeePct);
                // الأساس = إيرادات الوحدات السنوية فقط، غير شاملة الإيرادات الأخرى
                const operatorFeeBase = safeNum(rentCalc.annualRent);
                const operatorFeeFromRevenue = isExternalOperator ? operatorFeeBase * (operatorFeePct / 100) : 0;
                const operatorFeeAnnual = operatorFeeFromRevenue;
                // الأساس = متوسط الوحدات المشغولة فعلياً (يراعي نموذج Mix: يومي + سنوي)
                const occupiedUnits = safeNum(rentCalc.occupiedUnits);
                const effectiveOcc = safeNum(rentCalc.effectiveOcc);

                const elecMonthly = safeNum(opCostSettings.elecPerUnit) * occupiedUnits;
                const elecAnnual = elecMonthly * 12;
                const waterMonthly = safeNum(opCostSettings.waterPerUnit) * occupiedUnits;
                const waterAnnual = waterMonthly * 12;
                const utilitiesAnnual = elecAnnual + waterAnnual;
                
                const consumablesAnnual = safeNum(opCostSettings.consumablesPerUnit) * occupiedUnits * 12;
                const maintContracts = safeNum(opCostSettings.maintElevators) + safeNum(opCostSettings.maintSafety) + safeNum(opCostSettings.maintAC);
                const furnitureReplacement = safeNum(opCostSettings.furnitureReplacement);
                const buildingMaintenance = safeNum(opCostSettings.buildingMaintenance);
                // تم تحويل مصاريف التسويق إلى مبلغ ثابت
                const marketingAnnual = safeNum(opCostSettings.marketingFixed);
                
                // رسوم مرتبطة بوجود موظفين (تسقط عند التعاقد مع مشغل خارجي)
                const staffRelatedFees = safeNum(opCostSettings.feeResident) + safeNum(opCostSettings.feeMudad) + safeNum(opCostSettings.feeVisas);
                const govFees = safeNum(opCostSettings.feeTourism) + safeNum(opCostSettings.feeCommercial) + (isExternalOperator ? 0 : staffRelatedFees);
                const professionalFees = safeNum(opCostSettings.professionalFees);
                const kitchenExpenses = safeNum(opCostSettings.kitchenExpenses);
                // عند دخول صاحب الأرض كشريك عقاري لا يُخصم إيجار أرض من التكاليف التشغيلية
                const annualLandRental = isLandPartner ? 0 : safeNum(calc.annualLandValue);
                
                const otherOpTotal = (Array.isArray(opCostSettings.otherOperating) ? opCostSettings.otherOperating : []).reduce((s, o) => s + safeNum(o.value), 0);
                
                // استبدال الأثاث ليس تكلفة سنوية متكررة (يحدث مرتين خلال عمر المشروع)،
                // لذلك لا يُضاف إلى إجمالي التكاليف التشغيلية السنوية ويظهر في التدفقات النقدية في سنتَي الاستبدال.
                const totalOperatingCost = payrollAnnual + operatorFeeAnnual + utilitiesAnnual + consumablesAnnual + maintContracts + buildingMaintenance + marketingAnnual + govFees + professionalFees + kitchenExpenses + annualLandRental + otherOpTotal;

                return {
                    units, occ, occupiedUnits, effectiveOcc, payrollAnnual, payrollGross, elecMonthly, elecAnnual, waterMonthly, waterAnnual, utilitiesAnnual,
                    consumablesAnnual, maintContracts, furnitureReplacement, buildingMaintenance, marketingAnnual,
                    govFees, staffRelatedFees, professionalFees, kitchenExpenses, annualLandRental, otherOpTotal, totalOperatingCost,
                    isExternalOperator, operatorFeePct, operatorFeeBase, operatorFeeFromRevenue, operatorFeeAnnual,
                    isLandPartner
                };
            }, [opCostSettings, calc, rentCalc, isLandPartner]);

            // ── تصدير جدول التدفقات النقدية إلى Excel ─────────────────
            const exportCashFlowExcel = () => {
                const esc = (v) => String(v == null ? '' : v)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                const num = (v) => Math.round(safeNum(v));

                const years = Array.from({ length: projectionYears }, (_, i) => i);
                const head = (label) => '<th style="background:#1e293b;color:#fff;font-weight:bold;border:1px solid #94a3b8">' + esc(label) + '</th>';
                const th = () => '<tr>' + head('البند') + years.map(y => head('السنة ' + (y + 1))).join('') + '</tr>';

                const row = (label, values, opts = {}) => {
                    const bg = opts.bg ? `background:${opts.bg};` : '';
                    const color = opts.color ? `color:${opts.color};` : '';
                    const bold = opts.bold ? 'font-weight:bold;' : '';
                    return '<tr>'
                        + `<td style="border:1px solid #cbd5e1;${bg}${bold}text-align:right">${esc(label)}</td>`
                        + years.map(y => `<td style="border:1px solid #cbd5e1;${bg}${color}${bold}mso-number-format:'#,##0'">${num(values[y])}</td>`).join('')
                        + '</tr>';
                };

                const sectionRow = (label) => '<tr><td colspan="' + (projectionYears + 1) + '" style="background:#f1f5f9;font-weight:bold;text-align:right;border:1px solid #cbd5e1">' + esc(label) + '</td></tr>';
                const blank = () => '<tr><td colspan="' + (projectionYears + 1) + '"></td></tr>';

                let body = '';
                body += sectionRow('الإيرادات');
                cashFlowItems.filter(i => i.isPositive).forEach(item => { body += row(item.labelAr, matrix[item.id] || []); });
                body += row('إجمالي الإيرادات', yearlyTotals.revTotal, { bold: true, bg: '#dcfce7' });

                body += sectionRow('التكاليف التشغيلية');
                cashFlowItems.filter(i => !i.isPositive && !i.isCapex).forEach(item => { body += row(item.labelAr, matrix[item.id] || []); });
                body += row('إجمالي التكاليف التشغيلية', yearlyTotals.expTotal, { bold: true, bg: '#fee2e2' });

                body += row('صافي الربح التشغيلي (NOI)', yearlyTotals.noi, { bold: true, bg: '#d1fae5' });
                cashFlowItems.filter(i => i.isCapex).forEach(item => { body += row(item.labelAr, matrix[item.id] || []); });
                body += row('صافي التدفق النقدي', yearlyTotals.netProfit, { bold: true, bg: '#fef3c7' });

                body += blank();
                body += sectionRow('توزيع الأرباح والاسترداد');
                body += row('صافي الربح التشغيلي (NOI)', yearlyTotals.noi);
                body += row('استرداد رأس المال', profitDistribution.paybackSchedule);
                body += row(`حصة ${funderNameAr} من الأرباح`, profitDistribution.investorProfitShare);
                body += row('حصة بيلد وايز من الأرباح', profitDistribution.bwShare);
                if (isLandPartner) body += row('حصة شريك الأرض من الأرباح', profitDistribution.landShare);

                const info = [
                    ['اسم التقرير', 'التدفقات النقدية التشغيلية — بيلد وايز'],
                    ['تاريخ الإصدار', new Date().toLocaleDateString('ar-SA')],
                    ['مدة المشروع (سنة)', projectionYears],
                    ['إجمالي التكلفة الاستثمارية', num(calc.capitalInvestment)],
                    ['الممول', funderNameAr],
                    ['التعاقد على الأرض', landDeal.ar],
                    ['نظام الإدارة', opCalc.isExternalOperator ? 'مشغل خارجي' : 'إدارة ذاتية'],
                    ['نمو الإيرادات السنوي %', safeNum(growthSettings.revenueGrowth)],
                    ['نمو التكاليف التشغيلية %', safeNum(growthSettings.opexGrowth)],
                    ['نمو إيجار الأرض %', safeNum(growthSettings.landRentGrowth)]
                ].map(([k, v]) => `<tr><td style="border:1px solid #cbd5e1;font-weight:bold;text-align:right">${esc(k)}</td><td style="border:1px solid #cbd5e1;text-align:right" colspan="${projectionYears}">${esc(v)}</td></tr>`).join('');

                const html = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8">'
                    + '<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>'
                    + '<x:Name>التدفقات النقدية</x:Name><x:WorksheetOptions><x:DisplayRightToLeft/></x:WorksheetOptions>'
                    + '</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->'
                    + '<style>td,th{padding:4px 8px;font-family:Arial,sans-serif;font-size:11pt;text-align:center}</style>'
                    + '</head><body dir="rtl">'
                    + '<table border="1" cellspacing="0">' + info + '</table><br/>'
                    + '<table border="1" cellspacing="0">' + th() + body + '</table>'
                    + '</body></html>';

                const ok = downloadFile(html, `التدفقات_النقدية_بيلد_وايز_${stamp()}.xls`, 'application/vnd.ms-excel;charset=utf-8');
                if (ok) {
                    setIsExcelExported(true);
                    setTimeout(() => setIsExcelExported(false), 2500);
                }
            };

            const timeline = useMemo(() => {
                const arr = [];
                for (let i = 0; i < projectionYears; i++) {
                    arr.push({ idx: i, label: `Y${i + 1}` });
                }
                return arr;
            }, [projectionYears]);

            const cashFlowItems = useMemo(() => [
                { id: 'revRooms', nameEn: 'Rooms Revenue', labelAr: 'إيرادات الغرف', annualValue: rentCalc.annualRent, isPositive: true, growthKey: 'revenue' },
                { id: 'revOther', nameEn: 'Other Revenue', labelAr: 'إيرادات أخرى', annualValue: rentCalc.otherTotal, isPositive: true, growthKey: 'revenue' },
                { id: 'expPayroll', nameEn: 'Employee Payroll', labelAr: 'رواتب الموظفين', annualValue: -opCalc.payrollAnnual, isPositive: false, growthKey: 'opex' },
                { id: 'expOperator', nameEn: 'Operator Management Fee', labelAr: 'أتعاب المشغل الخارجي', annualValue: -opCalc.operatorFeeAnnual, isPositive: false, growthKey: 'revenue' },
                { id: 'expUtility', nameEn: 'Utility Bills', labelAr: 'فواتير المرافق', annualValue: -opCalc.utilitiesAnnual, isPositive: false, growthKey: 'opex' },
                { id: 'expConsumables', nameEn: 'Consumables', labelAr: 'المستهلكات', annualValue: -opCalc.consumablesAnnual, isPositive: false, growthKey: 'opex' },
                { id: 'expMaintCont', nameEn: 'Maintenance Contracts', labelAr: 'عقود الصيانة', annualValue: -opCalc.maintContracts, isPositive: false, growthKey: 'opex' },
                { id: 'expFurniture', nameEn: 'Furniture Replacement (Asset Renewal)', labelAr: 'استبدال الأثاث (إحلال الأصول)', annualValue: -opCalc.furnitureReplacement, isPositive: false, isCapex: true, growthKey: 'opex' },
                { id: 'expBuilding', nameEn: 'Building Maintenance', labelAr: 'صيانة المبنى', annualValue: -opCalc.buildingMaintenance, isPositive: false, growthKey: 'opex' },
                { id: 'expMarketing', nameEn: 'Marketing Expenses', labelAr: 'مصاريف التسويق', annualValue: -opCalc.marketingAnnual, isPositive: false, growthKey: 'opex' },
                { id: 'expGov', nameEn: 'Government fees', labelAr: 'الرسوم الحكومية', annualValue: -opCalc.govFees, isPositive: false, growthKey: 'opex' },
                { id: 'expProf', nameEn: 'Professional Fees', labelAr: 'أتعاب مهنية', annualValue: -opCalc.professionalFees, isPositive: false, growthKey: 'opex' },
                { id: 'expKitchen', nameEn: 'Kitchen Expenses', labelAr: 'مصاريف المطبخ', annualValue: -opCalc.kitchenExpenses, isPositive: false, growthKey: 'opex' },
                { id: 'expLandRent', nameEn: 'Annual Land Rent', labelAr: 'إيجار الأرض السنوي', annualValue: -opCalc.annualLandRental, isPositive: false, growthKey: 'landRent' },
            ].filter(item => (opCalc.isExternalOperator ? item.id !== 'expPayroll' : item.id !== 'expOperator') && !(opCalc.isLandPartner && item.id === 'expLandRent')), [rentCalc, opCalc]);

            const matrix = useMemo(() => {
                const mat = {};
                cashFlowItems.forEach(item => {
                    mat[item.id] = new Array(projectionYears).fill(0);
                    const dist = yearlyDistributions[item.id] || { startIdx: 0, duration: projectionYears, type: 'equal', customWeights: [] };
                    const dur = parseInt(dist.duration) || 1;
                    const start = parseInt(dist.startIdx) || 0;
                    const type = dist.type || 'equal';

                    // معدل النمو السنوي المركب الخاص بهذا البند
                    const growthRate = item.growthKey === 'revenue' ? (safeNum(growthSettings.revenueGrowth) / 100)
                                     : item.growthKey === 'landRent' ? (safeNum(growthSettings.landRentGrowth) / 100)
                                     : item.growthKey === 'opex' ? (safeNum(growthSettings.opexGrowth) / 100)
                                     : 0;

                    const totalVal = item.annualValue * dur;
                    let weights = [];

                    // التوزيع المخصص: النسب مفهرسة بالسنة المطلقة (Y1..Yn) لا بترتيبها داخل المدة،
                    // ما يتيح وضع نِسَب في سنوات متفرقة غير متتالية. النسق القديم (طول المصفوفة = المدة)
                    // ما يزال مدعوماً للملفات المحفوظة سابقاً.
                    if (type === 'custom' && (dist.customWeights || []).length === projectionYears) {
                        const weightsArray = dist.customWeights;
                        for (let y = 0; y < projectionYears; y++) {
                            const w = (parseFloat(weightsArray[y]) || 0) / 100;
                            if (w === 0) continue;
                            const growthFactor = growthRate !== 0 ? Math.pow(1 + growthRate, y) : 1;
                            mat[item.id][y] += totalVal * w * growthFactor;
                        }
                        return;
                    }

                    if (type === 'custom') {
                        const weightsArray = dist.customWeights || [];
                        for (let i = 0; i < dur; i++) weights.push((parseFloat(weightsArray[i]) || 0) / 100);
                    } else if (dur === 1) {
                        weights = [1];
                    } else if (type === 'equal') {
                        weights = new Array(dur).fill(1 / dur);
                    } else if (type === 'front') {
                        const sum = (dur * (dur + 1)) / 2;
                        for (let i = 0; i < dur; i++) weights.push((dur - i) / sum);
                    } else if (type === 'back') {
                        const sum = (dur * (dur + 1)) / 2;
                        for (let i = 0; i < dur; i++) weights.push((i + 1) / sum);
                    } else if (type === 'bell') {
                        let sum = 0;
                        for (let i = 0; i < dur; i++) {
                            const w = Math.sin(Math.PI * (i + 0.5) / dur);
                            weights.push(w);
                            sum += w;
                        }
                        weights = weights.map(w => w / sum);
                    }

                    for (let i = 0; i < dur; i++) {
                        const yearIdx = start + i;
                        if (yearIdx < projectionYears && weights[i] !== undefined && !isNaN(weights[i])) {
                            // معادلة القيمة المستقبلية مع نمو مركب: FV = PV × (1 + g)^n
                            const growthFactor = growthRate !== 0 ? Math.pow(1 + growthRate, yearIdx) : 1;
                            mat[item.id][yearIdx] += totalVal * weights[i] * growthFactor;
                        }
                    }
                });
                return mat;
            }, [cashFlowItems, yearlyDistributions, projectionYears, growthSettings]);

            const yearlyTotals = useMemo(() => {
                const revTotal = new Array(projectionYears).fill(0);
                const expTotal = new Array(projectionYears).fill(0);   // التكاليف التشغيلية (بدون إحلال الأصول)
                const capexTotal = new Array(projectionYears).fill(0); // استبدال الأثاث — إحلال أصول
                const noi = new Array(projectionYears).fill(0);        // صافي الربح التشغيلي
                const netProfit = new Array(projectionYears).fill(0);  // صافي التدفق النقدي = NOI + إحلال الأصول

                for(let i=0; i<projectionYears; i++) {
                    cashFlowItems.forEach(item => {
                        if (item.isPositive) revTotal[i] += matrix[item.id][i];
                        else if (item.isCapex) capexTotal[i] += matrix[item.id][i];
                        else expTotal[i] += matrix[item.id][i];
                    });
                    noi[i] = revTotal[i] + expTotal[i];
                    netProfit[i] = noi[i] + capexTotal[i];
                }
                return { revTotal, expTotal, capexTotal, noi, netProfit };
            }, [matrix, projectionYears, cashFlowItems]);

            const fastPaybackCalc = useMemo(() => {
                const C = calc.capitalInvestment;
                const netProfits = yearlyTotals.netProfit;
                let remaining = C;
                let years = 0;
                let months = 0;
                
                for (let i = 0; i < projectionYears; i++) {
                    if (netProfits[i] <= 0) continue;
                    if (remaining > netProfits[i]) {
                        remaining -= netProfits[i];
                    } else {
                        years = i;
                        const fraction = remaining / netProfits[i];
                        months = Math.ceil(fraction * 12);
                        remaining = 0;
                        break;
                    }
                }
                
                if (remaining > 0) return { possible: false };
                if (months === 12) { years++; months = 0; }
                return { possible: true, years, months };
            }, [calc.capitalInvestment, yearlyTotals.netProfit, projectionYears]);

            const flexPaybackCalc = useMemo(() => {
                const y = safeNum(targetPayback.years);
                const m = safeNum(targetPayback.months);
                const T = y + (m / 12);
                if (T <= 0) return null;
                
                const C = calc.capitalInvestment;
                let cumulativeProfit = 0;
                const netProfits = yearlyTotals.netProfit;
                
                for (let i = 0; i < Math.floor(T); i++) {
                    if (i < projectionYears) cumulativeProfit += Math.max(0, netProfits[i]);
                }
                
                const fraction = T - Math.floor(T);
                if (fraction > 0 && Math.floor(T) < projectionYears) {
                    cumulativeProfit += Math.max(0, netProfits[Math.floor(T)]) * fraction;
                }
                
                if (cumulativeProfit <= 0) return { error: {ar: 'لا توجد أرباح متوقعة كافية في هذه المدة.', en: 'No expected profits in this period.'} };
                
                let capRecoveryPct = (C / cumulativeProfit) * 100;
                
                // Smart Snap feature to auto-adjust to exactly 100% if time matches fast payback
                if (fastPaybackCalc.possible && y === fastPaybackCalc.years && m === fastPaybackCalc.months) {
                    capRecoveryPct = 100;
                }
                
                if (capRecoveryPct > 100) return { error: {ar: `يستحيل الاسترداد في هذه المدة. أقصى استرداد بـ 100% من الأرباح هو: ${formatDisplay((cumulativeProfit / C)*100, 1)}% من التكلفة.`, en: `Payback impossible in this period. Max recovery with 100% profit is ${formatDisplay((cumulativeProfit / C)*100, 1)}% of cost.`} };
                
                capRecoveryPct = Math.ceil(capRecoveryPct * 10) / 10; 
                if (capRecoveryPct > 100) capRecoveryPct = 100;
                
                const remaining = parseFloat((100 - capRecoveryPct).toFixed(1));
                
                // توزيع النسبة المتبقية: بيلد وايز + ممول البناء (+ شريك الأرض عند الشراكة العقارية)
                const bwSharePct = Math.min(100, Math.max(0, safeNum(simulatorBwShare)));
                const landSharePct = isLandPartner ? Math.min(100 - bwSharePct, Math.max(0, safeNum(simulatorLandShare))) : 0;
                const invSharePct = parseFloat((100 - bwSharePct - landSharePct).toFixed(1));

                let bwPct = parseFloat((remaining * (bwSharePct / 100)).toFixed(1));
                let landPct = parseFloat((remaining * (landSharePct / 100)).toFixed(1));
                let invPct = parseFloat((remaining - bwPct - landPct).toFixed(1));
                
                return { capRecoveryPct, invPct, bwPct, landPct, bwSharePct, landSharePct, invSharePct, cumulativeProfit, remaining };
            }, [targetPayback, calc.capitalInvestment, yearlyTotals.netProfit, projectionYears, simulatorBwShare, simulatorLandShare, isLandPartner, fastPaybackCalc]);


            const profitDistribution = useMemo(() => {
                const netProfits = yearlyTotals.netProfit; 
                const capitalInvestment = calc.capitalInvestment;
                
                const capRecoveryPct = safeNum(profitDistSettings.capitalRecoveryShare) / 100;
                const investorPrePct = safeNum(profitDistSettings.investorPrePaybackShare) / 100;
                const bwPrePct = safeNum(profitDistSettings.bwPrePaybackShare) / 100;
                
                const investorPostPct = safeNum(profitDistSettings.investorPostPaybackShare) / 100;
                const bwPostPct = safeNum(profitDistSettings.bwPostPaybackShare) / 100;

                // الطرف الثالث: شريك الأرض (صاحب الأرض) — فقط عند تفعيل الشراكة العقارية
                const landPrePct = isLandPartner ? safeNum(profitDistSettings.landPartnerPrePaybackShare) / 100 : 0;
                const landPostPct = isLandPartner ? safeNum(profitDistSettings.landPartnerPostPaybackShare) / 100 : 0;

                const paybackSchedule = new Array(projectionYears).fill(0);
                const investorProfitShare = new Array(projectionYears).fill(0);
                const bwShare = new Array(projectionYears).fill(0);
                const landShare = new Array(projectionYears).fill(0);
                
                let remainingCapital = capitalInvestment;
                let paybackYear = 0;
                let paybackMonth = 0;
                let isFullyPaidBack = false;

                let totalInvestorPreProfit = 0;
                let totalBwPre = 0;
                let totalLandPre = 0;
                let totalInvestorPost = 0;
                let totalBwPost = 0;
                let totalLandPost = 0;
                let totalPayback = 0;

                for (let i = 0; i < projectionYears; i++) {
                    const yearProfit = netProfits[i];
                    if (yearProfit <= 0) {
                        continue;
                    }

                    if (!isFullyPaidBack) {
                        let potentialPayback = yearProfit * capRecoveryPct;
                        
                        if (remainingCapital > potentialPayback) {
                            const invProfit = yearProfit * investorPrePct;
                            const bwProfit = yearProfit * bwPrePct;
                            const landProfit = yearProfit * landPrePct;

                            paybackSchedule[i] = potentialPayback;
                            investorProfitShare[i] = invProfit;
                            bwShare[i] = bwProfit;
                            landShare[i] = landProfit;
                            
                            totalPayback += potentialPayback;
                            totalInvestorPreProfit += invProfit;
                            totalBwPre += bwProfit;
                            totalLandPre += landProfit;
                            
                            remainingCapital -= potentialPayback;
                        } else {
                            isFullyPaidBack = true;
                            paybackSchedule[i] = remainingCapital;
                            paybackYear = i;
                            
                            const fractionOfYear = potentialPayback > 0 ? remainingCapital / potentialPayback : 0;
                            paybackMonth = Math.ceil(fractionOfYear * 12);
                            
                            const profitNeededForPayback = capRecoveryPct > 0 ? remainingCapital / capRecoveryPct : 0;
                            const remainingProfit = yearProfit - profitNeededForPayback;
                            
                            const invPreProfit = profitNeededForPayback * investorPrePct;
                            const bwPreProfit = profitNeededForPayback * bwPrePct;
                            const landPreProfit = profitNeededForPayback * landPrePct;
                            
                            const invPostProfit = remainingProfit * investorPostPct;
                            const bwPostProfit = remainingProfit * bwPostPct;
                            const landPostProfit = remainingProfit * landPostPct;
                            
                            investorProfitShare[i] = invPreProfit + invPostProfit;
                            bwShare[i] = bwPreProfit + bwPostProfit;
                            landShare[i] = landPreProfit + landPostProfit;

                            totalPayback += remainingCapital;
                            totalInvestorPreProfit += invPreProfit;
                            totalBwPre += bwPreProfit;
                            totalLandPre += landPreProfit;
                            totalInvestorPost += invPostProfit;
                            totalBwPost += bwPostProfit;
                            totalLandPost += landPostProfit;
                            
                            remainingCapital = 0;
                        }
                    } else {
                        const invPostProfit = yearProfit * investorPostPct;
                        const bwPostProfit = yearProfit * bwPostPct;
                        const landPostProfit = yearProfit * landPostPct;

                        investorProfitShare[i] = invPostProfit;
                        bwShare[i] = bwPostProfit;
                        landShare[i] = landPostProfit;
                        
                        totalInvestorPost += invPostProfit;
                        totalBwPost += bwPostProfit;
                        totalLandPost += landPostProfit;
                    }
                }

                let paybackStringAr = "-";
                let paybackStringEn = "-";
                
                if (isFullyPaidBack) {
                    let y = paybackYear;
                    let m = paybackMonth;
                    if (m === 12) { y += 1; m = 0; }
                    
                    let yStrAr = ""; let yStrEn = "";
                    if (y === 1) { yStrAr = "سنة"; yStrEn = "1 Year"; }
                    else if (y === 2) { yStrAr = "سنتان"; yStrEn = "2 Years"; }
                    else if (y >= 3 && y <= 10) { yStrAr = `${y} سنوات`; yStrEn = `${y} Years`; }
                    else if (y > 10) { yStrAr = `${y} سنة`; yStrEn = `${y} Years`; }

                    let mStrAr = ""; let mStrEn = "";
                    if (m === 1) { mStrAr = "شهر"; mStrEn = "1 Month"; }
                    else if (m === 2) { mStrAr = "شهران"; mStrEn = "2 Months"; }
                    else if (m >= 3 && m <= 10) { mStrAr = `${m} أشهر`; mStrEn = `${m} Months`; }
                    else if (m > 10) { mStrAr = `${m} شهراً`; mStrEn = `${m} Months`; }

                    if (y === 0 && m > 0) { paybackStringAr = mStrAr; paybackStringEn = mStrEn; }
                    else if (y > 0 && m === 0) { paybackStringAr = yStrAr; paybackStringEn = yStrEn; }
                    else if (y > 0 && m > 0) { paybackStringAr = `${yStrAr} و ${mStrAr}`; paybackStringEn = `${yStrEn} and ${mStrEn}`; }
                    else { paybackStringAr = "أقل من شهر"; paybackStringEn = "< 1 Month"; }
                } else if (remainingCapital < capitalInvestment) {
                    paybackStringAr = `> ${projectionYears} سنة`;
                    paybackStringEn = `> ${projectionYears} Years`;
                }

                const totalInvestorProfit = Math.max(0, investorProfitShare.reduce((a, b) => a + b, 0));
                const totalBwProfit = Math.max(0, bwShare.reduce((a, b) => a + b, 0));
                const totalLandProfit = Math.max(0, landShare.reduce((a, b) => a + b, 0));

                return {
                    capitalInvestment,
                    investorProfitShare,
                    bwShare,
                    landShare,
                    paybackSchedule,
                    isLandPartner,
                    totalPayback,
                    // إجمالي ما يعود للممول = استرداد رأس المال + حصته من الأرباح
                    totalInvestorShare: totalPayback + totalInvestorProfit,
                    totalBwShare: totalBwProfit,
                    totalLandShare: totalLandProfit,
                    totalInvestorProfit,
                    totalBwProfit,
                    totalLandProfit,
                    // إجمالي الأرباح الموزعة (بدون رأس المال المسترد)
                    totalProfit: totalInvestorProfit + totalBwProfit + totalLandProfit,
                    // نسب العرض المعتمدة في كل الرسوم البيانية — مشتقة من نفس المبالغ أعلاه
                    pctTotalDistributions: sharePercents([totalPayback + totalInvestorProfit, totalBwProfit, totalLandProfit], 2),
                    pctNetProfit: sharePercents([totalInvestorProfit, totalBwProfit, totalLandProfit], 2),
                    pctPrePayback: sharePercents([totalPayback + totalInvestorPreProfit, totalBwPre, totalLandPre], 2),
                    pctPostPayback: sharePercents([totalInvestorPost, totalBwPost, totalLandPost], 2),
                    // إجمالي التوزيعات (استرداد رأس المال + كل الأرباح)
                    totalDistributions: totalPayback + totalInvestorProfit + totalBwProfit + totalLandProfit,
                    breakEvenPointAr: paybackStringAr,
                    breakEvenPointEn: paybackStringEn,
                    prePaybackInvestorAmount: totalPayback + totalInvestorPreProfit,
                    prePaybackBwAmount: totalBwPre,
                    prePaybackLandAmount: totalLandPre,
                    postPaybackInvestorAmount: totalInvestorPost,
                    postPaybackBwAmount: totalBwPost,
                    postPaybackLandAmount: totalLandPost,
                    prePaybackTotal: totalPayback + totalInvestorPreProfit + totalBwPre + totalLandPre,
                    postPaybackTotal: totalInvestorPost + totalBwPost + totalLandPost
                };
            }, [yearlyTotals.netProfit, calc.capitalInvestment, profitDistSettings, projectionYears, isLandPartner]);

            const financialMetrics = useMemo(() => {
                const initialInvestment = calc.capitalInvestment;
                const netProfits = yearlyTotals.netProfit;
                const discountRateDec = safeNum(discountRate) / 100;
                
                // 1. Project Total Net Profit (إجمالي الأرباح الصافية لكامل المدة)
                const totalNetProfit = netProfits.reduce((sum, val) => sum + val, 0);
                
                // 2. Project ROI (Return on Investment)
                const roi = initialInvestment > 0 ? (totalNetProfit / initialInvestment) * 100 : 0;
                
                // 3. Funder ROI (Total Funder Profit / Initial Investment)
                const funderRoi = initialInvestment > 0 ? (profitDistribution.totalInvestorProfit / initialInvestment) * 100 : 0;
                
                // 4. NPV (Net Present Value) = Sum of (CashFlow_t / (1 + r)^t) - Initial Investment
                let npv = -initialInvestment;
                for (let t = 0; t < projectionYears; t++) {
                     npv += netProfits[t] / Math.pow(1 + discountRateDec, t + 1);
                }
                
                // 5. IRR (Internal Rate of Return)
                const cashFlowsForIRR = [-initialInvestment, ...netProfits];
                const irr = calculateIRR(cashFlowsForIRR);

                // 6. تدفقات الممول النقدية = استرداد رأس المال + حصته من الأرباح
                const funderCashFlows = [];
                let funderTotalDistributions = 0;
                for (let t = 0; t < projectionYears; t++) {
                    const cf = safeNum((profitDistribution.paybackSchedule || [])[t]) + safeNum((profitDistribution.investorProfitShare || [])[t]);
                    funderCashFlows.push(cf);
                    funderTotalDistributions += cf;
                }

                // 7. NPV للممول
                let funderNpv = -initialInvestment;
                for (let t = 0; t < projectionYears; t++) {
                    funderNpv += funderCashFlows[t] / Math.pow(1 + discountRateDec, t + 1);
                }

                // 8. IRR للممول
                const funderIrr = calculateIRR([-initialInvestment, ...funderCashFlows]);

                // 9. MOIC = إجمالي التوزيعات ÷ رأس المال المستثمر
                const totalProjectDistributions = netProfits.reduce((sum, val) => sum + Math.max(0, val), 0);
                const moic = initialInvestment > 0 ? totalProjectDistributions / initialInvestment : 0;
                const funderMoic = initialInvestment > 0 ? funderTotalDistributions / initialInvestment : 0;

                return {
                    totalNetProfit,
                    roi: isNaN(roi) ? 0 : roi,
                    funderRoi: isNaN(funderRoi) ? 0 : funderRoi,
                    npv: isNaN(npv) ? 0 : npv,
                    irr: irr !== null && !isNaN(irr) ? irr : 0,
                    funderNpv: isNaN(funderNpv) ? 0 : funderNpv,
                    funderIrr: funderIrr !== null && !isNaN(funderIrr) ? funderIrr : 0,
                    moic: isNaN(moic) ? 0 : moic,
                    funderMoic: isNaN(funderMoic) ? 0 : funderMoic,
                    totalProjectDistributions,
                    funderTotalDistributions
                };
            }, [calc.capitalInvestment, yearlyTotals.netProfit, projectionYears, discountRate, profitDistribution]);

            const handleUpdateDistribution = (itemId, startIdx, duration, type) => {
                setYearlyDistributions(prev => {
                    const currentDist = prev[itemId] || {};
                    const oldWeights = currentDist.customWeights || [];
                    const newType = type || currentDist.type || 'equal';
                    const newDur = Math.max(1, Math.min(projectionYears, parseInt(duration) || 1));
                    const newStart = Math.max(0, Math.min(projectionYears - 1, parseInt(startIdx) || 0));
                    let newCustomWeights = oldWeights;

                    if (newType === 'custom' && oldWeights.length !== projectionYears) {
                        // بناء مصفوفة بطول سنوات المشروع، مع ترحيل النسب القديمة (كانت نسبية للمدة)
                        newCustomWeights = new Array(projectionYears).fill(0);
                        if (oldWeights.length > 0) {
                            const oldStart = parseInt(currentDist.startIdx) || 0;
                            oldWeights.forEach((w, i) => {
                                const y = oldStart + i;
                                if (y < projectionYears) newCustomWeights[y] = parseFloat(w) || 0;
                            });
                        } else {
                            // توزيع متساوٍ ابتدائي على نافذة (سنة البدء + المدة)
                            const span = Math.min(newDur, projectionYears - newStart);
                            const equalVal = parseFloat((100 / span).toFixed(2));
                            for (let i = 0; i < span; i++) newCustomWeights[newStart + i] = equalVal;
                        }
                    }

                    return { ...prev, [itemId]: { startIdx: newStart, duration: newDur, type: newType, customWeights: newCustomWeights } };
                });
            };

            const handleReplaceCustomWeights = (itemId, weights) => {
                setYearlyDistributions(prev => ({
                    ...prev,
                    [itemId]: { ...(prev[itemId] || {}), customWeights: weights }
                }));
            };

            const renderRow = (item, index) => {
                const distId = item.id;
                const dist = yearlyDistributions[distId] || { startIdx: 0, duration: projectionYears, type: 'equal', customWeights: [] };
                const isExpanded = expandedItem === item.id;
                const rowBg = item.isPositive ? 'bg-[#fdf8f1] hover:bg-[#faeedb]' : 'bg-slate-50 hover:bg-slate-100';
                
                return (
                    <React.Fragment key={item.id}>
                        <tr onClick={() => setExpandedItem(isExpanded ? null : item.id)} className={`border-b border-slate-200 cursor-pointer transition-colors ${rowBg}`}>
                            <td className={`p-4 text-left font-bold border-r border-slate-200 sticky left-0 z-20 shadow-[4px_0_10px_rgba(0,0,0,0.03)] ${rowBg}`}>
                                <div className="flex items-center justify-between group">
                                    <div className="flex flex-col gap-0.5" dir="ltr">
                                        <span className={item.isPositive ? 'text-slate-800 text-[13px] leading-tight font-black' : 'text-slate-700 text-[12px] leading-tight font-bold'}>{item.nameEn}</span>
                                        <span className={item.isPositive ? 'text-slate-500 text-[11px] leading-tight font-bold' : 'text-slate-400 text-[10px] leading-tight font-normal'}>{item.labelAr}</span>
                                    </div>
                                    <span className={`transition-opacity print:hidden ${isExpanded ? 'text-[#C19A6B] opacity-100' : 'text-slate-400 opacity-0 group-hover:opacity-100'}`}>
                                        <Icon name="settings-2" className="w-4 h-4" />
                                    </span>
                                </div>
                            </td>
                            {timeline.map(m => {
                                const val = matrix[item.id][m.idx];
                                return <td key={m.idx} className={`p-3 border-l border-slate-200 text-[12px] ${val !== 0 ? (item.isPositive ? 'text-slate-800 font-bold' : 'text-slate-700 font-normal') : 'text-slate-300'}`}>
                                    {val !== 0 ? formatCashFlow(val) : ''}
                                </td>;
                            })}
                        </tr>
                        {isExpanded && (
                            <tr className="bg-slate-900 border-b-2 border-[#C19A6B] print:hidden">
                                <td colSpan={projectionYears + 1} className="p-0 text-right align-top bg-slate-900 shadow-[inset_0_4px_10px_rgba(0,0,0,0.5)]">
                                    <div className="flex flex-col gap-4 fade-in w-full p-6 sticky left-[300px] w-[calc(100vw-300px)]" onClick={(e)=> e.stopPropagation()} dir="rtl">
                                        <div className="flex items-center gap-2 text-[#C19A6B] font-black border-b border-slate-700 pb-3">
                                            <Icon name="bar-chart-3" className="w-5 h-5 text-[#C19A6B]" /> 
                                            <div className="flex flex-col">
                                                <span className="text-sm">هندسة التوزيع المالي (عبر السنوات)</span>
                                                <span className="text-[10px] uppercase font-normal text-slate-400" dir="ltr">Financial Distribution Engineering (Over Years)</span>
                                            </div>
                                        </div>
                                        <div className="flex flex-col lg:flex-row gap-8">
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 lg:w-1/3">
                                                <div className="flex flex-col gap-1.5 text-right">
                                                    <label className="text-[10px] font-bold text-slate-400">طريقة التوزيع | <span dir="ltr">Distribution Type</span></label>
                                                    <select className="bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-xs font-bold outline-none focus:border-[#C19A6B] text-white cursor-pointer shadow-sm w-full" value={dist.type || 'equal'} onChange={(e) => handleUpdateDistribution(distId, dist.startIdx, dist.duration, e.target.value)}>
                                                        <option value="equal" className="text-white bg-slate-800">توزيع متساوٍ (Linear)</option>
                                                        <option value="bell" className="text-white bg-slate-800">منحنى التنفيذ (S-Curve)</option>
                                                        <option value="front" className="text-white bg-slate-800">مكثف في البداية (Front-Loaded)</option>
                                                        <option value="back" className="text-white bg-slate-800">مكثف في النهاية (Back-Loaded)</option>
                                                        <option value="custom" className="text-[#C19A6B] font-black bg-slate-800">توزيع مخصص (Custom %)</option>
                                                    </select>
                                                </div>
                                                <div className="flex flex-col gap-1.5 text-right">
                                                    <label className="text-[10px] font-bold text-slate-400">سنة البدء | <span dir="ltr">Start Year</span>{dist.type === 'custom' && <span className="text-slate-600"> (لا يؤثر في المخصص)</span>}</label>
                                                    <select className="bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-xs font-bold outline-none focus:border-[#C19A6B] text-white cursor-pointer shadow-sm w-full" value={dist.startIdx} onChange={(e) => handleUpdateDistribution(distId, e.target.value, dist.duration, dist.type)}>
                                                        {timeline.map(m => (<option key={m.idx} value={m.idx} className="text-white bg-slate-800">السنة (Y{m.idx + 1})</option>))}
                                                    </select>
                                                </div>
                                                <div className="flex flex-col gap-1.5 text-right">
                                                    <label className="text-[10px] font-bold text-slate-400">المدة | <span dir="ltr">Duration</span></label>
                                                    <input type="number" min="1" max={projectionYears} className="bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-xs font-bold w-full text-center outline-none focus:border-[#C19A6B] text-white shadow-sm" value={dist.duration} onChange={(e) => handleUpdateDistribution(distId, dist.startIdx, e.target.value, dist.type)} />
                                                </div>
                                            </div>
                                            {dist.type === 'custom' && (
                                                <CustomWeightsEditor
                                                    key={distId}
                                                    projectionYears={projectionYears}
                                                    weights={(() => {
                                                        const raw = dist.customWeights || [];
                                                        if (raw.length === projectionYears) return raw;
                                                        // ترحيل النسق القديم (نسب نسبية للمدة) إلى فهرسة بالسنة المطلقة
                                                        const abs = new Array(projectionYears).fill(0);
                                                        const st = parseInt(dist.startIdx) || 0;
                                                        raw.forEach((w, i) => { const y = st + i; if (y < projectionYears) abs[y] = parseFloat(w) || 0; });
                                                        return abs;
                                                    })()}
                                                    onChange={(w) => handleReplaceCustomWeights(distId, w)}
                                                />
                                            )}
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        )}
                    </React.Fragment>
                );
            };

            const isRent = rentSettings.mode === 'rent';
            // إجمالي الإيرادات لكامل مدة المشروع
            const displayTotalRev = isRent ? yearlyTotals.revTotal.reduce((a,b)=>a+b, 0) : calc.totalRevenue;
            // إجمالي التكاليف الإنشائية (تكلفة البناء الكاملة شاملة الاحتياطي) — لا تشمل التشغيل
            const displayTotalCost = calc.totalDevCostFinal;
            // إجمالي التكاليف التشغيلية لكامل المدة
            const displayTotalOpex = Math.abs(yearlyTotals.expTotal.reduce((a,b)=>a+b, 0));
            // إجمالي الأرباح = إجمالي الإيرادات − إجمالي التكاليف التشغيلية
            const displayNetProfit = isRent ? (displayTotalRev - displayTotalOpex) : calc.netProfit;

            const goToPage = (id) => {
                setCurrentPage(id);
                if (isMobile) setIsSidebarOpen(false);
            };

            const SidebarItem = ({ id, labelAr, labelEn, iconName }) => (
                <button 
                  onClick={() => goToPage(id)} 
                  className={`w-full flex items-center gap-4 px-5 py-3 rounded-2xl transition-all duration-300 ${
                    currentPage === id 
                    ? 'bg-[#C19A6B] text-white shadow-xl shadow-[#C19A6B]/20 transform translate-x-[-4px]' 
                    : 'text-slate-500 hover:bg-[#f9f3e9] hover:text-[#C19A6B]'
                  }`}
                >
                  <Icon name={iconName} className="w-5 h-5 shrink-0" />
                  <div className="flex flex-col items-start text-right">
                      <span className="font-black text-sm">{labelAr}</span>
                      <span className={`text-[10px] uppercase tracking-wider ${currentPage === id ? 'text-white/80' : 'text-slate-400'}`} dir="ltr">{labelEn}</span>
                  </div>
                </button>
            );

            return (
                <ErrorBoundary>
                    <div className="app-shell flex h-screen w-full bg-[#fdfdfd] overflow-hidden text-right font-sans" dir="rtl">

                        {/* طبقة تعتيم خلف القائمة المنزلقة على الجوال */}
                        {isMobile && isSidebarOpen && (
                            <div onClick={() => setIsSidebarOpen(false)} className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 lg:hidden print:hidden"></div>
                        )}

                        <aside className={`bg-white border-l shadow-2xl sidebar-transition overflow-hidden flex flex-col print:hidden ${isMobile ? `mobile-drawer ${isSidebarOpen ? 'is-open' : ''}` : `shrink-0 z-50 ${isSidebarOpen ? 'w-72' : 'w-0'}`}`}>
                            <div className="p-6 lg:p-8 border-b bg-[#f9f3e9]/30 text-center font-sans flex items-center justify-between gap-2">
                                <div className="flex-1"><Logo /></div>
                                {isMobile && (
                                    <button onClick={() => setIsSidebarOpen(false)} className="p-2 rounded-xl bg-white text-slate-400 hover:text-[#C19A6B] shrink-0 border border-slate-100">
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                )}
                            </div>
                            <nav className="flex-1 p-4 space-y-2 overflow-y-auto font-black font-sans text-right mt-4">
                                <SidebarItem id="dashboard" labelAr={pageTitles.dashboard.ar} labelEn={pageTitles.dashboard.en} iconName="layout-dashboard" />
                                <SidebarItem id="land" labelAr={pageTitles.land.ar} labelEn={pageTitles.land.en} iconName="map" />
                                <SidebarItem id="costs" labelAr={pageTitles.costs.ar} labelEn={pageTitles.costs.en} iconName="hard-hat" />
                                <SidebarItem id="revenue" labelAr={pageTitles.revenue.ar} labelEn={pageTitles.revenue.en} iconName="receipt" />
                                <SidebarItem id="operating" labelAr={pageTitles.operating.ar} labelEn={pageTitles.operating.en} iconName="wallet" />
                                <SidebarItem id="capital" labelAr={pageTitles.capital.ar} labelEn={pageTitles.capital.en} iconName="pie-chart" />
                                <SidebarItem id="op_cashflow" labelAr={pageTitles.op_cashflow.ar} labelEn={pageTitles.op_cashflow.en} iconName="calendar-days" />
                                
                                <div className="pt-8 mt-8 border-t border-slate-100">
                                    <button 
                                      onClick={triggerPrint} 
                                      className={`w-full flex items-center gap-4 px-5 py-4 rounded-2xl transition-all duration-300 border-2 border-dashed ${isPrintingMode ? 'border-[#C19A6B] bg-[#fdf8f1] text-[#C19A6B] animate-pulse' : 'border-slate-200 text-slate-500 hover:border-[#C19A6B] hover:bg-[#f9f3e9] hover:text-[#C19A6B]'}`}
                                    >
                                      <Icon name={isPrintingMode ? "loader-2" : "printer"} className={`w-5 h-5 shrink-0 ${isPrintingMode ? 'animate-spin' : ''}`} />
                                      <div className="flex flex-col items-start text-right">
                                          <span className="font-black text-sm">{isPrintingMode ? 'جاري التجهيز...' : 'الملخص التنفيذي'}</span>
                                          <span className="text-[10px] uppercase tracking-wider text-slate-400" dir="ltr">{isPrintingMode ? 'Preparing...' : 'Executive Summary (Print)'}</span>
                                      </div>
                                    </button>
                                </div>
                            </nav>
                        </aside>

                        <main className="flex-1 flex flex-col h-full bg-[#fdfdfd] min-w-0 font-sans">
                            <header className="h-16 lg:h-20 bg-white/80 backdrop-blur-md border-b px-4 lg:px-10 flex items-center justify-between sticky top-0 z-40 shrink-0 font-sans text-right print:hidden">
                               <div className="flex items-center gap-3 lg:gap-6 min-w-0">
                                   <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-2.5 bg-[#f9f3e9] text-[#C19A6B] rounded-xl hover:bg-[#C19A6B] hover:text-white transition-all shadow-sm"><Icon name={isSidebarOpen ? "x" : "menu"} className="w-5 h-5" /></button>
                                   <div className="flex flex-col">
                                       <h2 className="font-black text-slate-800 text-base lg:text-xl font-sans uppercase tracking-wide lg:tracking-widest leading-tight truncate">{pageTitles[currentPage].ar}</h2>
                                       <span className="text-[9px] lg:text-[11px] text-[#C19A6B] font-bold uppercase tracking-widest truncate" dir="ltr">{pageTitles[currentPage].en}</span>
                                   </div>
                               </div>
                               <div className="flex items-center gap-2 lg:gap-3 shrink-0">
                                   <button onClick={exportSnapshot} title="إصدار نسخة HTML كاملة تحتوي جميع البيانات" className={`flex items-center gap-2 px-3 lg:px-5 py-2.5 rounded-xl font-bold transition-all shadow-sm font-sans border-2 ${isExported ? 'bg-emerald-500 text-white border-emerald-500' : 'bg-white text-[#C19A6B] border-[#C19A6B]/30 hover:border-[#C19A6B] hover:bg-[#fdf8f1]'}`}>
                                       <Icon name={isExported ? "check-circle" : "download"} className="w-4 h-4 shrink-0" />
                                       <div className="hidden sm:flex flex-col items-center leading-tight">
                                           <span className="text-sm">{isExported ? 'تم الإصدار' : 'إصدار نسخة'}</span>
                                           <span className="text-[8px] uppercase tracking-wider font-normal mt-0.5" dir="ltr">{isExported ? 'File Downloaded' : 'Export HTML'}</span>
                                       </div>
                                   </button>
                                   <button onClick={saveAllData} className={`flex items-center gap-2 px-3 lg:px-6 py-2.5 rounded-xl font-bold transition-all shadow-sm font-sans ${isSaved ? 'bg-emerald-500 text-white' : 'bg-[#a37e4f] text-white hover:bg-[#8b6b43]'}`}>
                                       <Icon name={isSaved ? "check-circle" : "save"} className="w-4 h-4 shrink-0" />
                                       <div className="hidden sm:flex flex-col items-center leading-tight">
                                           <span className="text-sm">{isSaved ? 'تم الحفظ' : 'حفظ البيانات'}</span>
                                           {isSaved && <span className="text-[8px] uppercase tracking-wider font-normal mt-0.5" dir="ltr">Saved Successfully</span>}
                                       </div>
                                   </button>
                               </div>
                            </header>

                            {exportError && (
                                <div className="bg-rose-50 border-b border-rose-200 text-rose-600 text-xs font-bold px-4 lg:px-10 py-2 flex items-center gap-2 print:hidden">
                                    <Icon name="alert-triangle" className="w-4 h-4 shrink-0" /> {exportError}
                                </div>
                            )}

                            <div className="flex-1 overflow-y-auto main-scroll text-right font-sans">
                                
                               {/* --- شاشة الملخص التنفيذي للطباعة فقط (Executive Summary) --- */}
                               <div className="executive-report-print font-sans" dir="rtl">

                                   {/* ══════════════ الصفحة 1 : الهوية والمؤشرات ══════════════ */}
                                   <section className="report-page">
                                       {/* ترويسة */}
                                       <div className="report-block">

                                                           </div>

                                                       </p>

                                                                   {profitDistribution.breakEvenPointAr}

                                                                                        setSimulatorLandShare(v);

                                                           <Icon name="check-circle" className="w-5 h-5" /> 
                                                           تطبيق (Apply)
                                                       </button>
                                                   </div>
                                               </div>
                                          </div>

                                                              { key: 'capitalRecoveryShare', label: `استرداد رأس المال (لـ ${funderNameAr})`, className: 'text-blue-600' },
