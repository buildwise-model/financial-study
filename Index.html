<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيلد وايز - التحليل المالي الإستراتيجي | Build Wise - Strategic Financial Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@100..900&display=swap" rel="stylesheet">

    <!-- بيانات النسخة المُصدَّرة: تُملأ تلقائياً عند «إصدار نسخة كاملة» وتُقرأ عند فتح الملف -->
    <script id="bw-snapshot" type="application/json"></script>

    <!--
      نلتقط نسخة أصلية من مصدر الصفحة قبل أن يبنِيَ React أي محتوى.
      هذا المستمع يُسجَّل قبل مستمع Babel فيعمل أولاً، و #root ما يزال فارغاً حينها.
    -->
    <script>
        (function () {
            var capture = function () {
                if (!window.__BW_PRISTINE_HTML__) {
                    try { window.__BW_PRISTINE_HTML__ = document.documentElement.outerHTML; } catch (e) {}
                }
            };
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', capture);
            else capture();
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: 'Noto Sans Arabic', sans-serif; background-color: #fdfdfd; margin: 0; overflow: hidden; -webkit-text-size-adjust: 100%; }
        .main-scroll { height: calc(100vh - 80px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: #C19A6B transparent; -webkit-overflow-scrolling: touch; }

        /* ── تحسينات الأجهزة المحمولة ───────────────────────────── */
        @media (max-width: 1023px) {
            /* ارتفاع فعلي للشاشة يتفادى مشكلة شريط المتصفح في iOS */
            .app-shell { height: 100dvh; }
            .main-scroll { height: calc(100dvh - 64px); -webkit-overflow-scrolling: touch; }

            /* الشريط الجانبي يتحول إلى قائمة منزلقة فوق المحتوى */
            .mobile-drawer {
                position: fixed;
                top: 0; bottom: 0; right: 0;
                width: 17rem;
                max-width: 85vw;
                transform: translateX(100%);
                transition: transform .3s ease;
                z-index: 60;
            }
            .mobile-drawer.is-open { transform: translateX(0); }

            /* تكبير مساحات اللمس ومنع تكبير iOS التلقائي عند التركيز على الحقول */
            input, select, button { font-size: 16px; }
            input[type="text"], input[type="number"] { min-height: 40px; }

            /* تقليل الحشوات الضخمة المصممة لسطح المكتب */
            .rounded-\[3rem\] { border-radius: 1.5rem !important; }
            .rounded-\[2\.5rem\] { border-radius: 1.5rem !important; }
            .rounded-\[2rem\] { border-radius: 1.25rem !important; }
        }

        /* تلميح التمرير الأفقي للجداول على الشاشات الصغيرة */
        @media (max-width: 767px) {
            .horizontal-scroll::-webkit-scrollbar { height: 6px; }
        }
        .main-scroll::-webkit-scrollbar { width: 6px; }
        .main-scroll::-webkit-scrollbar-thumb { background-color: #C19A6B; border-radius: 10px; }
        .horizontal-scroll::-webkit-scrollbar { height: 8px; }
        .horizontal-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .horizontal-scroll::-webkit-scrollbar-thumb { background: #C19A6B; border-radius: 10px; }
        .sidebar-transition { transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        input { text-align: center !important; outline: none !important; border: 1px solid transparent; }
        input:focus { border-color: #C19A6B !important; background-color: white !important; border-radius: 8px; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        .row-header-ltr { position: sticky; left: 0; z-index: 10; text-align: left; font-weight: 700; border-right: 2px solid rgba(0,0,0,0.1) !important; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(193, 154, 107, 0.15); }
        
        /* إعدادات الطباعة الاحترافية للإدارة العليا */
        @media print {
            @page { 
                size: A4 portrait;
                margin: 0; /* الهوامش تُدار داخل .report-page لضبط الصفحة بالكامل */
            }
            
            /* إخفاء واجهة المستخدم العادية بالكامل في وضع الطباعة */
            body > #root > div > aside, 
            body > #root > div > main > header,
            body > #root > div > main > div > .no-print-area { 
                display: none !important; 
            }

            /* السماح للمحتوى بالتمدد لعدة صفحات (إلغاء قص الشاشة) */
            body, html, #root, #root > div, main, .main-scroll, .flex-1 { 
                overflow: visible !important; 
                height: auto !important; 
                min-height: auto !important;
                background: white !important; 
                display: block !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                position: static !important;
            }
            
            * { 
                -webkit-print-color-adjust: exact !important; 
                print-color-adjust: exact !important; 
                text-rendering: optimizeLegibility !important;
            }

            /* تصميم صفحة الطباعة المخصصة */
            .executive-report-print {
                display: block !important;
                width: 100%;
                margin: 0;
                padding: 0;
                background: white;
                box-sizing: border-box;
            }

            /* كل قسم صفحة A4 كاملة: لا فراغ في الأعلى ولا في الأسفل */
            .report-page {
                width: 210mm;
                min-height: 296mm;
                margin: 0;
                padding: 11mm 12mm 8mm;
                box-sizing: border-box;
                background: white;
                display: flex;
                flex-direction: column;
                page-break-after: always;
                break-after: page;
                page-break-inside: avoid;
                break-inside: avoid;
            }
            .report-page:last-child {
                page-break-after: auto;
                break-after: auto;
            }

            /* المحتوى يتمدد ليملأ ارتفاع الورقة بالكامل */
            .report-flow {
                flex: 1 1 auto;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                gap: 5mm;
                min-height: 0;
            }
            .report-block { page-break-inside: avoid; break-inside: avoid; }

            .print-avoid-break { page-break-inside: avoid; break-inside: avoid; }

            /* إخفاء سكرول البارات في الطباعة */
            ::-webkit-scrollbar { display: none; }
        }

        /* الإخفاء الافتراضي لشاشة الطباعة على الشاشة العادية */
        @media screen {
            .executive-report-print {
                display: none !important;
            }
        }

        /* Custom Slider Style */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #C19A6B;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 10px rgba(193, 154, 107, 0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #475569;
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const safeNum = (val) => { const n = parseFloat(val); return isNaN(n) ? 0 : n; };

        const formatDisplay = (num, decimals = 0) => {
            if (num === '-' || num === '> 60' || (typeof num === 'string' && isNaN(parseFloat(num)))) return num;
            const val = safeNum(num);
            if (val === 0 && decimals === 0) return "0";
            return val.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: decimals });
        };

        const formatCashFlow = (num) => {
            if (!num || Math.abs(num) < 0.5) return '-';
            if (num < 0) return `(${Math.abs(num).toLocaleString('en-US', {maximumFractionDigits:0})})`;
            return num.toLocaleString('en-US', {maximumFractionDigits:0});
        };

        // بيانات النسخة المُصدَّرة (إن وُجدت داخل الملف نفسه)
        const BW_SNAPSHOT = (() => {
            try {
                const el = document.getElementById('bw-snapshot');
                if (!el) return null;
                const raw = (el.textContent || '').trim();
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                return (parsed && typeof parsed === 'object' && parsed.data) ? parsed : null;
            } catch (e) { console.warn('Snapshot parse failed', e); return null; }
        })();

        // الأولوية: تعديلات المستخدم المحفوظة محلياً ← بيانات النسخة المُصدَّرة ← القيم الافتراضية
        const loadInitialState = (key, defaultValue) => {
            try {
                const saved = window.localStorage.getItem(key);
                if (saved !== null) {
                    const parsed = JSON.parse(saved);
                    if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) return { ...defaultValue, ...parsed };
                    return parsed;
                }
            } catch (error) { console.warn("Error reading localStorage", error); }

            if (BW_SNAPSHOT && Object.prototype.hasOwnProperty.call(BW_SNAPSHOT.data, key)) {
                const snap = BW_SNAPSHOT.data[key];
                if (snap && typeof snap === 'object' && !Array.isArray(snap)) return { ...defaultValue, ...snap };
                if (snap !== undefined && snap !== null) return snap;
            }
            return defaultValue;
        };

        const generateDefaultDistributions = (years) => {
            const d = {};
            const basicItems = ['revRooms', 'revOther', 'expPayroll', 'expOperator', 'expUtility', 'expConsumables', 'expMaintCont', 'expMarketing', 'expGov', 'expProf', 'expKitchen'];
            basicItems.forEach(id => {
                d[id] = { startIdx: 0, duration: years, type: 'equal', customWeights: [] };
            });

            const delayedDur = Math.max(1, years - 5);
            d['expBuilding'] = { startIdx: 5, duration: delayedDur, type: 'equal', customWeights: [] };

            // استبدال الأثاث: مرتان خلال عمر المشروع (تقريباً عند ثلث ومنتصف/ثلثَي المدة).
            // duration = 2 يعني أن المبلغ المُدخل هو تكلفة الاستبدال الواحد، والوزنان 50% لكل مرة.
            const furnFirst = Math.min(Math.max(1, Math.round(years / 3)), Math.max(0, years - 1));
            const furnSecond = Math.min(Math.max(furnFirst + 1, Math.round((years * 2) / 3)), Math.max(0, years - 1));
            const furnWeights = new Array(years).fill(0);
            furnWeights[furnFirst] = 50;
            if (furnSecond > furnFirst) furnWeights[furnSecond] = 50; else furnWeights[furnFirst] = 100;
            d['expFurniture'] = { startIdx: furnFirst, duration: 2, type: 'custom', customWeights: furnWeights };

            const landWeights = [];
            let currentMultiplier = 1;
            let sumMultipliers = 0;
            for(let i=0; i<years; i++) {
                if (i > 0 && i % 5 === 0) currentMultiplier *= 1.05;
                landWeights.push(currentMultiplier);
                sumMultipliers += currentMultiplier;
            }
            d['expLandRent'] = {
                startIdx: 0,
                duration: years,
                type: 'custom',
                customWeights: landWeights.map(w => (w / sumMultipliers) * 100)
            };
            return d;
        };

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, errorMsg: '' }; }
            static getDerivedStateFromError(error) { return { hasError: true, errorMsg: error.toString() }; }
            componentDidCatch(error, errorInfo) { console.error("System Error:", error, errorInfo); }
            render() {
                if (this.state.hasError) return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-50 p-4 text-center font-sans" dir="rtl">
                        <div className="bg-white p-10 rounded-[2.5rem] shadow-xl border border-red-100 max-w-2xl w-full text-right">
                            <h2 className="text-2xl font-black text-red-600 mb-2">حدث خطأ برمجي | System Error</h2>
                            <p className="text-sm font-bold text-slate-500 mb-4">تم حماية بياناتك من الفقدان. يرجى إعادة ضبط المصنع لتحديث الصفحة.<br/><span dir="ltr" className="text-xs">Your data is safe. Please reset to factory settings to refresh.</span></p>
                            <div className="bg-red-50 text-red-800 p-4 rounded-xl text-left text-xs mb-6 font-mono overflow-auto max-h-48" dir="ltr">{this.state.errorMsg}</div>
                            <button onClick={() => { localStorage.clear(); window.location.reload(); }} className="w-full py-3 bg-slate-900 text-white rounded-xl font-black flex flex-col items-center justify-center gap-1 hover:bg-slate-800">
                                <span>إعادة ضبط المصنع</span>
                                <span className="text-[10px] uppercase tracking-widest font-normal text-slate-300" dir="ltr">Factory Reset</span>
                            </button>
                        </div>
                    </div>
                );
                return this.props.children;
            }
        }

        function Logo() {
            return (
                <div className="flex flex-col items-center gap-5 py-4 text-center">
                    <svg width="80" height="40" viewBox="0 0 250 110" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M0 5 H50 A20 20 0 0 1 50 45 H0 V5 Z" fill="#C19A6B" />
                        <path d="M0 55 H50 A20 20 0 0 1 50 95 H0 V55 Z" fill="#C19A6B" />
                        <rect x="100" y="5" width="38" height="100" rx="19" fill="#C19A6B" />
                        <rect x="150" y="45" width="38" height="60" rx="19" fill="#C19A6B" />
                        <rect x="200" y="5" width="38" height="100" rx="19" fill="#C19A6B" />
                    </svg>
                    <div className="text-center px-4 w-full font-black text-slate-900 tracking-[0.1em] uppercase leading-none font-sans">BUILD WISE</div>
                    <div className="h-1 bg-[#C19A6B] mt-2 rounded-full mx-auto w-full opacity-30 font-sans"></div>
                </div>
            );
        }

        function Icon({ name, className }) {
            const containerRef = useRef(null);
            useEffect(() => { 
                const initIcon = () => {
                    if (!containerRef.current) return;
                    if (!window.lucide) {
                        setTimeout(initIcon, 100);
                        return;
                    }
                    containerRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    window.lucide.createIcons({ root: containerRef.current }); 
                };
                initIcon();
            }, [name]);
            return <span ref={containerRef} className={className}></span>;
        }

        // ── أدوات النسب المئوية ─────────────────────────────────────────────
        // كل الحسابات الداخلية تجري على أعداد صحيحة من "أجزاء المئة" (basis points
        // بدقة خانتين عشريتين) لتفادي أخطاء الفاصلة العائمة مثل 0.1+0.2 = 0.30000000000000004
        const PCT_SCALE = 100;               // خانتان عشريتان
        const PCT_FULL = 100 * PCT_SCALE;    // 100% = 10000 وحدة

        const toPctUnits = (v) => Math.round(safeNum(v) * PCT_SCALE);
        const fromPctUnits = (u) => u / PCT_SCALE;
        const roundPct = (v) => fromPctUnits(toPctUnits(v));

        // مجموع نسب بدقة كاملة (يعيد نسبة مئوية لا رقماً عشرياً متراكم الخطأ)
        const sumPct = (values) => fromPctUnits(values.reduce((acc, v) => acc + toPctUnits(v), 0));

        // توزيع نسب مئوية من قيم مالية بحيث يكون المجموع 100% بالضبط.
        // يستخدم أسلوب "أكبر باقٍ" (Largest Remainder) فلا تظهر فروقات 99.99% أو 100.01%.
        const sharePercents = (values, decimals = 2) => {
            const clean = values.map(v => Math.max(0, safeNum(v)));
            const total = clean.reduce((a, b) => a + b, 0);
            if (total <= 0) return clean.map(() => 0);
            const f = Math.pow(10, decimals);
            const target = Math.round(100 * f);
            const raw = clean.map(v => (v / total) * 100 * f);
            const out = raw.map(v => Math.floor(v));
            let remainder = target - out.reduce((a, b) => a + b, 0);
            const order = raw
                .map((v, i) => ({ i, frac: v - Math.floor(v) }))
                .sort((a, b) => b.frac - a.frac);
            for (let k = 0; k < order.length && remainder > 0; k++, remainder--) out[order[k].i] += 1;
            return out.map(v => v / f);
        };

        function SmartNumericInput({ value, onChange, className, decimals = 0, isGold = false, readOnly = false }) {
            const [localValue, setLocalValue] = useState(formatDisplay(value, decimals));
            const inputRef = useRef(null);
            useEffect(() => { if (document.activeElement !== inputRef.current) setLocalValue(formatDisplay(value, decimals)); }, [value, decimals]);
            const handleChange = (e) => {
                if (readOnly) return;
                let val = e.target.value.replace(/[,،٫]/g, '.').replace(/[^\d.]/g, '');
                const parts = val.split('.');
                if (parts.length > 2) val = parts[0] + '.' + parts.slice(1).join('');
                setLocalValue(e.target.value);
                onChange(val !== "" ? parseFloat(val) : 0);
            };
            return <input ref={inputRef} type="text" inputMode="decimal" readOnly={readOnly} value={localValue} onChange={handleChange} onBlur={() => setLocalValue(formatDisplay(value, decimals))} className={`${className} ${isGold ? 'text-[#C19A6B]' : ''}`} spellCheck="false" autoComplete="off" />
        }

        // مكوّن إدخال نسب مرحلة في شلال التوزيع.
        // • يمنع تجاوز 100% لحظياً أثناء الكتابة.
        // • إذا بقيت خانة واحدة لم يلمسها المستخدم، تُحسب تلقائياً = 100% − مجموع الباقي.
        // • يعمل مع أي عدد من الخانات (3 أو 4 أو غيرها) وليس مرتبطاً بخانة بعينها.
        const WaterfallStageInputs = ({ fields, values, onChange, accent = '#C19A6B' }) => {
            const [touched, setTouched] = useState([]);

            const units = fields.map(f => toPctUnits(values[f.key]));
            const totalUnits = units.reduce((a, b) => a + b, 0);
            const totalPct = fromPctUnits(totalUnits);
            const isBalanced = totalUnits === PCT_FULL;

            const handleChange = (idx, raw) => {
                const key = fields[idx].key;
                const nextTouched = touched.includes(key) ? touched : [...touched, key];

                // الخانات التي لم يلمسها المستخدم بعد (باستثناء الخانة الحالية) = مرشحة للإكمال التلقائي
                const autoIdx = fields.findIndex((f, i) => i !== idx && !nextTouched.includes(f.key));
                const hasAuto = autoIdx !== -1
                    && fields.every((f, i) => i === idx || i === autoIdx || nextTouched.includes(f.key));

                const next = units.slice();
                let v = Math.max(0, toPctUnits(raw));

                // مجموع الخانات الأخرى التي لن تتغير
                const othersUnits = fields.reduce((acc, f, i) => {
                    if (i === idx) return acc;
                    if (hasAuto && i === autoIdx) return acc;
                    return acc + units[i];
                }, 0);

                // لا يُسمح بتجاوز 100% في أي حال
                v = Math.min(v, Math.max(0, PCT_FULL - othersUnits));
                next[idx] = v;

                if (hasAuto) next[autoIdx] = Math.max(0, PCT_FULL - othersUnits - v);

                setTouched(nextTouched);
                const patch = {};
                fields.forEach((f, i) => { patch[f.key] = fromPctUnits(next[i]); });
                onChange(patch);
            };

            const completeToHundred = () => {
                const diffUnits = PCT_FULL - totalUnits;
                if (diffUnits === 0) return;
                const next = units.slice();
                if (diffUnits > 0) {
                    // أضف الفارق لآخر خانة لم يلمسها المستخدم، وإلا فللأخيرة
                    let target = fields.findIndex(f => !touched.includes(f.key));
                    if (target === -1) target = fields.length - 1;
                    next[target] += diffUnits;
                } else {
                    // اخصم الفارق تناسبياً من الخانات غير الصفرية
                    let over = -diffUnits;
                    for (let i = fields.length - 1; i >= 0 && over > 0; i--) {
                        const take = Math.min(next[i], over);
                        next[i] -= take;
                        over -= take;
                    }
                }
                const patch = {};
                fields.forEach((f, i) => { patch[f.key] = fromPctUnits(next[i]); });
                onChange(patch);
            };

            const resetAuto = () => setTouched([]);

            return (
                <div>
                    <div className={`grid grid-cols-1 ${fields.length >= 4 ? 'md:grid-cols-2 xl:grid-cols-4' : 'md:grid-cols-3'} gap-5`}>
                        {fields.map((f, i) => {
                            const isAuto = !touched.includes(f.key) && touched.length === fields.length - 1;
                            return (
                                <div key={f.key} className="w-full space-y-2">
                                    <label className="text-[11px] font-bold text-slate-500 flex items-center gap-1.5">
                                        <span className="truncate">{f.label}</span>
                                        {isAuto && <span className="text-[9px] font-black text-emerald-600 bg-emerald-50 border border-emerald-200 rounded px-1.5 py-0.5 shrink-0">تلقائي</span>}
                                    </label>
                                    <div className={`bg-white border-2 rounded-xl p-2 flex items-center transition-colors shadow-sm print:border-none print:bg-transparent ${isAuto ? 'border-emerald-300' : 'border-slate-200 focus-within:border-[#C19A6B]'}`}>
                                        <SmartNumericInput
                                            decimals={2}
                                            value={values[f.key]}
                                            onChange={(v) => handleChange(i, v)}
                                            className={`w-full text-center font-black text-xl bg-transparent outline-none print:text-left ${f.className || ''}`}
                                        />
                                        <span className="text-slate-400 font-black text-sm px-2">%</span>
                                    </div>
                                </div>
                            );

        };

        // Helper function for IRR calculation
        const calculateIRR = (cashFlows, guess = 0.1) => {
            const maxIterations = 1000;
            const tolerance = 1e-7;
            let irr = guess;
            
            for (let i = 0; i < maxIterations; i++) {
                let npv = 0;
                let derivativeNpv = 0;
                
                for (let t = 0; t < cashFlows.length; t++) {
                    const denominator = Math.pow(1 + irr, t);
                    npv += cashFlows[t] / denominator;
                    if (t > 0) {
                        derivativeNpv -= (t * cashFlows[t]) / Math.pow(1 + irr, t + 1);
                    }
                }
                
                if (Math.abs(npv) < tolerance) {
                    return irr * 100; // Return as percentage
                }
                
                const newIrr = irr - (npv / derivativeNpv);
                if (Math.abs(newIrr - irr) < tolerance) {
                    return newIrr * 100;
                }
                irr = newIrr;
            }
            return null; // Could not converge
        };

            useEffect(() => {
                const MOBILE_MAX = 1023;

                const applyMobile = (mobile) => {
                    if (mobile === lastMobile) return;
                    lastMobile = mobile;
                    setIsMobile(mobile);

                const mq = (typeof window.matchMedia === 'function')

                    : null;

                if (mq) {
                    const onChange = (e) => applyMobile(e.matches);
                    applyMobile(mq.matches);
                    if (mq.addEventListener) mq.addEventListener('change', onChange);
                    else if (mq.addListener) mq.addListener(onChange);
                    return () => {
                        if (mq.removeEventListener) mq.removeEventListener('change', onChange);
                        else if (mq.removeListener) mq.removeListener(onChange);
                    };
                }

                const onResize = () => applyMobile(window.innerWidth <= MOBILE_MAX);

            }, []);

            const downloadFile = (content, filename, mime) => {
                try {
                    const blob = new Blob(["\uFEFF", content], { type: mime });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 4000);
                    return true;
                } catch (error) {
                    console.error('Download failed', error);
                    return false;
                }
            };

            // ── إصدار نسخة HTML كاملة تحتوي كل البيانات ─────────────────
            const exportSnapshot = () => {

                    exportedAt: new Date().toISOString(),
                    data: {
                        'bw_hotel_currentPage_v18': currentPage,
                        'bw_hotel_landAreas_v18': landAreas,

                    setTimeout(() => setExportError(''), 5000);

                }

                // نمنع إغلاق وسم السكربت مبكراً داخل النص
                const json = JSON.stringify(payload).replace(/</g, '\\u003c');
                const tag = '<script id="bw-snapshot" type="application/json">' + json + '<' + '/script>';
                const re = /<script id="bw-snapshot"[\s\S]*?<\/script>/;

            const calc = useMemo(() => {
                const upperFloorKeys = ['groundFloor', 'mezzanine', 'typical1', 'typical2', 'annex'];
                const allFloorKeys = ['basement', ...upperFloorKeys];
                
                const floorBuilt = (k) => safeNum(landAreas[k]?.area) * safeNum(landAreas[k]?.floors);
                
                let totalBuiltArea = 0;
                let newTotalServiceArea = 0;
                let newSellableArea = 0;
                let totalUpperArea = 0;
                let unitsCount = 0;
                
                allFloorKeys.forEach(k => {
                    const fArea = floorBuilt(k);
                    totalBuiltArea += fArea;
                    if (k !== 'basement') totalUpperArea += fArea;

                    const defaultSrvPct = k === 'basement' ? 0 : 20;
                    const srvPct = landAreas[k]?.servicePercent !== undefined ? safeNum(landAreas[k].servicePercent) : defaultSrvPct;
                    const srvArea = fArea * (srvPct / 100);
                    const rentArea = fArea - srvArea;
                    
                    newTotalServiceArea += srvArea;
                    if (k !== 'basement') newSellableArea += rentArea;
                    
                    // حساب الغرف مع الأخذ بالاعتبار القيمة المحسوبة آلياً إذا لم يتم الإدخال يدوياً
                    let floorRooms = safeNum(landAreas[k]?.rooms) || 0;
                    if (k !== 'basement' && floorRooms === 0 && safeNum(landAreas.avgUnitSize) > 0) {
                        floorRooms = Math.round(rentArea / safeNum(landAreas.avgUnitSize));
                    }
                    unitsCount += floorRooms;
                });

                const totalServiceArea = newTotalServiceArea;
                const sellableArea = newSellableArea;
                const totalResAreaVal = totalUpperArea;
                
                const derivedAvgUnitSize = unitsCount > 0 ? (sellableArea / unitsCount) : 0;
                
                const residentialSalesRevenue = sellableArea * safeNum(costSettings.resSalesRate);
                const parkingSalesRevenue = safeNum(costSettings.parkingCount) * safeNum(costSettings.parkingUnitPrice);
                const basementServicesRevenue = safeNum(costSettings.basementServicesArea) * safeNum(costSettings.basementServicesRate);
                const totalRevenue = residentialSalesRevenue + parkingSalesRevenue + basementServicesRevenue;

                const isRent = rentSettings.mode === 'rent';
                const landRentPrice = safeNum(rentSettings.annualLandRent);
                const annualLandValue = landRentPrice * safeNum(landAreas.landArea);
                
                const totalLandCost = 0;

                const residentialDirect = totalResAreaVal * safeNum(costSettings.directResRate);
                const basementDirect = (safeNum(landAreas.basement?.area) * safeNum(landAreas.basement?.floors)) * safeNum(costSettings.directBasementRate);
                const softscapeDirect = safeNum(landAreas.softscape?.area || 0) * safeNum(costSettings.softscapeRate);
                const hardscapeDirect = safeNum(landAreas.hardscape?.area || 0) * safeNum(costSettings.hardscapeRate);
