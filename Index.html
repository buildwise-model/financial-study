                                                        <div><div className="text-xs mb-2">سداد رأس المال</div><div className="w-20 bg-white border-2 border-slate-200 rounded-lg p-2 mx-auto focus-within:border-[#BD8F3F]"><SmartNumericInput value={profitDistSettings.paybackRatePct} onChange={v => setProfitDistSettings({...profitDistSettings, paybackRatePct: v})} className="w-full text-center font-black text-blue-600" /></div></div>
                                                        <div><div className="text-xs mb-2">{funderLabel}</div><div className="w-20 bg-white border-2 border-slate-200 rounded-lg p-2 mx-auto focus-within:border-[#BD8F3F]"><SmartNumericInput value={profitDistSettings.investorPrePaybackShare} onChange={v => setProfitDistSettings({...profitDistSettings, investorPrePaybackShare: v})} className="w-full text-center font-black text-emerald-600" /></div></div>
                                                        <div><div className="text-xs mb-2">بيلد وايز (مطور)</div><div className="w-20 bg-white border-2 border-slate-200 rounded-lg p-2 mx-auto focus-within:border-[#BD8F3F]"><SmartNumericInput value={profitDistSettings.bwPrePaybackShare} onChange={v => setProfitDistSettings({...profitDistSettings, bwPrePaybackShare: v})} className="w-full text-center font-black text-[#BD8F3F]" /></div></div>
                                                    </div>
                                                    {(safeNum(profitDistSettings.paybackRatePct) + safeNum(profitDistSettings.investorPrePaybackShare) + safeNum(profitDistSettings.bwPrePaybackShare)) !== 100 && (
                                                        <div className="text-[10px] text-rose-500 font-bold mt-3 animate-pulse">تنبيه: مجموع النسب يجب أن يساوي 100%</div>
                                                    )}
                                                </div>
                                                <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 text-center">
                                                    <div className="flex flex-col mb-4">
                                                        <h4 className="text-slate-500 font-bold">حصص الأرباح <span className="text-emerald-500 underline">بعد</span> الاسترداد</h4>
                                                        <span className="text-[9px] text-slate-400 uppercase tracking-widest" dir="ltr">Post-Payback Shares</span>
                                                    </div>
                                                    <div className="flex justify-center items-center gap-8">
                                                        <div><div className="text-xs mb-2">{funderLabel}</div><div className="w-20 bg-white border-2 border-slate-200 rounded-lg p-2 mx-auto focus-within:border-[#BD8F3F]"><SmartNumericInput value={profitDistSettings.investorPostPaybackShare} onChange={v => setProfitDistSettings({...profitDistSettings, investorPostPaybackShare: v, bwPostPaybackShare: 100-v})} className="w-full text-center font-black text-emerald-600" /></div></div>
                                                        <div><div className="text-xs mb-2">بيلد وايز (مطور)</div><div className="w-20 bg-white border-2 border-slate-200 rounded-lg p-2 mx-auto focus-within:border-[#BD8F3F]"><SmartNumericInput value={profitDistSettings.bwPostPaybackShare} onChange={v => setProfitDistSettings({...profitDistSettings, bwPostPaybackShare: v, investorPostPaybackShare: 100-v})} className="w-full text-center font-black text-[#BD8F3F]" /></div></div>
                                                    </div>
                                                    {(safeNum(profitDistSettings.investorPostPaybackShare) + safeNum(profitDistSettings.bwPostPaybackShare)) !== 100 && (
                                                        <div className="text-[10px] text-rose-500 font-bold mt-3 animate-pulse">تنبيه: مجموع النسب يجب أن يساوي 100%</div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>

                                        {fundingSettings.type !== 'self' && (
                                            <div className="bg-white rounded-[2rem] p-8 shadow-sm border border-slate-100 fade-in">
                                                <div className="mb-6 flex flex-col">
                                                    <h3 className="text-xl font-black text-slate-800 flex items-center gap-3"><Icon name="door-open" className="text-[#BD8F3F] w-6 h-6" /> آلية تخارج المستثمر الخارجي</h3>
                                                    <span className="text-[10px] text-slate-400 font-bold uppercase tracking-widest" dir="ltr">Investor Exit Strategy</span>
                                                </div>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                                                    <button onClick={() => setProfitDistSettings({...profitDistSettings, exitStrategy: 'full_duration'})} className={`p-4 rounded-xl border-2 font-black transition-all ${profitDistSettings.exitStrategy === 'full_duration' || !profitDistSettings.exitStrategy ? 'border-[#BD8F3F] bg-[#fdf8f1] text-[#BD8F3F] shadow-md scale-105' : 'border-slate-100 bg-slate-50 text-slate-500 hover:bg-slate-100'}`}>بنهاية مدة المشروع الكاملة</button>
                                                    <button onClick={() => setProfitDistSettings({...profitDistSettings, exitStrategy: 'target_roi'})} className={`p-4 rounded-xl border-2 font-black transition-all ${profitDistSettings.exitStrategy === 'target_roi' ? 'border-[#BD8F3F] bg-[#fdf8f1] text-[#BD8F3F] shadow-md scale-105' : 'border-slate-100 bg-slate-50 text-slate-500 hover:bg-slate-100'}`}>عند تحقيق عائد (ROI) مستهدف</button>
                                                </div>
                                                {profitDistSettings.exitStrategy === 'target_roi' && (
                                                    <div className="flex flex-col md:flex-row items-center justify-between bg-slate-50 p-4 rounded-xl border border-slate-200 fade-in gap-4">
                                                        <div className="flex flex-col">
                                                            <span className="font-bold text-slate-700">نسبة العائد المستهدف للتخارج (ROI)</span>
                                                            <span className="text-[10px] text-slate-400">بمجرد تحقيق المستثمر لهذه النسبة (كأرباح صافية)، تنتقل أرباحه المتبقية للمطور بيلد وايز.</span>
                                                        </div>
                                                        <div className="flex items-center gap-2 bg-white border-2 border-slate-200 rounded-xl p-2 w-full md:w-48 focus-within:border-[#BD8F3F]">
                                                            <SmartNumericInput value={profitDistSettings.targetRoiPct || 100} onChange={v => setProfitDistSettings({...profitDistSettings, targetRoiPct: v})} className="w-full text-center font-black text-xl text-[#BD8F3F]" />
                                                            <span className="text-slate-400 font-black text-xl">%</span>
                                                        </div>
                                                    </div>
                                                )}
                                                <div className="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4 fade-in">
                                                    <div className="relative overflow-hidden rounded-2xl bg-gradient-to-br from-[#30261D] to-[#1e1510] border border-[#BD8F3F]/40 p-5 shadow-md">
                                                        <div className="absolute -top-10 -left-10 w-32 h-32 bg-[#BD8F3F]/15 rounded-full blur-2xl"></div>
                                                        <div className="relative flex items-center justify-between gap-4">
                                                            <div className="flex items-center gap-3 min-w-0">
                                                                <div className="p-3 bg-[#BD8F3F]/20 text-[#BD8F3F] rounded-xl shrink-0"><Icon name="hourglass" className="w-6 h-6" /></div>
                                                                <div className="flex flex-col min-w-0">
                                                                    <span className="text-sm font-black text-white">فترة استرداد رأس المال</span>
                                                                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest" dir="ltr">Capital Payback Period</span>
                                                                </div>
                                                            </div>
                                                            <div className="flex flex-col items-end shrink-0">
                                                                <span className="text-2xl font-black text-[#BD8F3F] whitespace-nowrap">{profitDistribution.breakEvenPointAr}</span>
                                                                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest" dir="ltr">{profitDistribution.breakEvenPointEn}</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="relative overflow-hidden rounded-2xl bg-[#fdf8f1] border border-[#BD8F3F]/30 p-5 shadow-sm" style={{ borderRight: '5px solid #8C3B19' }}>
                                                        <div className="relative flex items-center justify-between gap-4">
                                                            <div className="flex items-center gap-3 min-w-0">
                                                                <div className="p-3 bg-white text-[#8C3B19] rounded-xl shrink-0 border border-[#8C3B19]/20"><Icon name="door-open" className="w-6 h-6" /></div>
                                                                <div className="flex flex-col min-w-0">
                                                                    <span className="text-sm font-black text-slate-800">متوقع التخارج خلال</span>
                                                                    <span className="text-[10px] font-bold text-[#8C3B19]">{investorExitMethodAr}</span>
                                                                </div>
                                                            </div>
                                                            <div className="flex flex-col items-end shrink-0">
                                                                <span className="text-2xl font-black text-[#8C3B19] whitespace-nowrap">{investorExitDisplayAr}</span>
                                                                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest" dir="ltr">{investorExitDisplayEn}</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {}
                                {(currentPage === 'cashflow' || isPrintingMode) && (
                                    <div className="space-y-8 fade-in text-right">
                                        <div className="bg-white rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden">
                                            <div className="p-6 border-b bg-[#fdf8f1] flex flex-col gap-1">
                                                <div className="flex items-center gap-3 text-[#BD8F3F] font-black text-xl"><Icon name="table" className="w-6 h-6" /> جدول التدفقات النقدية التقديري</div>
                                                <span className="text-[10px] text-[#BD8F3F]/70 font-bold uppercase tracking-widest" dir="ltr">Estimated Cash Flow Statement</span>
                                            </div>
                                            <div className="overflow-x-auto" dir="rtl">
                                                <table className="w-full text-center border-collapse min-w-[800px]">
                                                    <thead className="bg-slate-800 text-white font-black text-xs">
                                                        <tr><th className="p-4 border-r border-slate-700">السنة <span className="block text-[9px] uppercase font-normal opacity-70" dir="ltr">Year</span></th>{timeline.map(m => <th key={m.idx} className="p-4 border-r border-slate-700 whitespace-nowrap">{m.label}</th>)}<th className="p-4 border-r-2 border-[#BD8F3F] bg-[#30261D] text-[#BD8F3F] whitespace-nowrap">الإجمالي <span className="block text-[9px] uppercase font-normal opacity-70" dir="ltr">Total</span></th></tr>
                                                    </thead>
                                                    <tbody className="text-sm font-bold">
                                                        <tr className="border-b border-slate-100 hover:bg-slate-50"><td className="p-4 text-right bg-slate-50 text-emerald-600">الإيرادات <span className="block text-[9px] uppercase font-normal" dir="ltr">Revenues</span></td>{yearlyTotals.revTotal.map((v, i) => <td key={i} className="p-3 text-emerald-600">{formatDisplay(v)}</td>)}<td className="p-3 font-black bg-[#fdf8f1] border-r-2 border-[#BD8F3F] text-emerald-700">{formatDisplay((yearlyTotals.revTotal || []).reduce((a, b) => a + safeNum(b), 0))}</td></tr>
                                                        <tr className="border-b border-slate-100 hover:bg-slate-50"><td className="p-4 text-right bg-slate-50 text-rose-600">التكاليف التشغيلية <span className="block text-[9px] uppercase font-normal" dir="ltr">Total OPEX</span></td>{yearlyTotals.expTotal.map((v, i) => <td key={i} className="p-3 text-rose-600">{safeNum(v) !== 0 ? `(${formatDisplay(Math.abs(v))})` : formatDisplay(v)}</td>)}<td className="p-3 font-black bg-[#fdf8f1] border-r-2 border-[#BD8F3F] text-rose-700">{`(${formatDisplay(Math.abs((yearlyTotals.expTotal || []).reduce((a, b) => a + safeNum(b), 0)))})`}</td></tr>
                                                        <tr className="border-b border-slate-100 bg-slate-100"><td className="p-4 text-right text-slate-800">صافي التدفق <span className="block text-[9px] uppercase font-normal" dir="ltr">Net Cash Flow</span></td>{yearlyTotals.netProfit.map((v, i) => <td key={i} className="p-3 text-slate-800">{formatDisplay(v)}</td>)}<td className="p-3 font-black bg-[#fdf8f1] border-r-2 border-[#BD8F3F] text-slate-900">{formatDisplay((yearlyTotals.netProfit || []).reduce((a, b) => a + safeNum(b), 0))}</td></tr>
                                                        <tr className="border-b border-slate-100 hover:bg-slate-50"><td className="p-4 text-right bg-slate-50 text-blue-600">استرداد إجمالي رأس المال <span className="block text-[9px] uppercase font-normal" dir="ltr">Recovery</span></td>{profitDistribution.paybackSchedule.map((v, i) => <td key={i} className="p-3 text-blue-600">{formatDisplay(v)}</td>)}<td className="p-3 font-black bg-[#fdf8f1] border-r-2 border-[#BD8F3F] text-blue-700">{formatDisplay((profitDistribution.paybackSchedule || []).reduce((a, b) => a + safeNum(b), 0))}</td></tr>
                                                        <tr className="border-b border-slate-100 hover:bg-slate-50"><td className="p-4 text-right bg-slate-50 text-emerald-700">أرباح المستثمر الخارجي <span className="block text-[9px] uppercase font-normal" dir="ltr">Ext. Investor Profit</span></td>{profitDistribution.investorProfitShare.map((v, i) => <td key={i} className="p-3 text-emerald-700">{formatDisplay(v)}</td>)}<td className="p-3 font-black bg-[#fdf8f1] border-r-2 border-[#BD8F3F] text-emerald-800">{formatDisplay((profitDistribution.investorProfitShare || []).reduce((a, b) => a + safeNum(b), 0))}</td></tr>
                                                        <tr className="border-b border-slate-100 hover:bg-slate-50"><td className="p-4 text-right bg-slate-50 text-[#BD8F3F]">أرباح بيلد وايز ({fundingSettings.type === 'external' ? 'مطور' : 'مطور+ممول'}) <span className="block text-[9px] uppercase font-normal" dir="ltr">BW Profit</span></td>{profitDistribution.bwProfitShare.map((v, i) => <td key={i} className="p-3 text-[#BD8F3F]">{formatDisplay(v)}</td>)}<td className="p-3 font-black bg-[#fdf8f1] border-r-2 border-[#BD8F3F] text-[#8C3B19]">{formatDisplay((profitDistribution.bwProfitShare || []).reduce((a, b) => a + safeNum(b), 0))}</td></tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                        <div className="bg-white rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden">
                                            <div className="p-6 border-b bg-[#fdf8f1] flex flex-col gap-1">
                                                <div className="flex items-center gap-3 text-[#BD8F3F] font-black text-xl"><Icon name="wallet" className="w-6 h-6" /> إجمالي التوزيعات لكل طرف</div>
                                                <span className="text-[10px] text-[#BD8F3F]/70 font-bold uppercase tracking-widest" dir="ltr">Total Distributions by Party</span>
                                            </div>
                                            <div className="overflow-x-auto" dir="rtl">
                                                <table className="w-full text-center border-collapse min-w-[800px]">
                                                    <thead className="bg-slate-800 text-white font-black text-xs">
                                                        <tr><th className="p-4 border-r border-slate-700">السنة <span className="block text-[9px] uppercase font-normal opacity-70" dir="ltr">Year</span></th>{timeline.map(m => <th key={m.idx} className="p-4 border-r border-slate-700 whitespace-nowrap">{m.label}</th>)}<th className="p-4 border-r-2 border-[#BD8F3F] bg-[#30261D] text-[#BD8F3F] whitespace-nowrap">الإجمالي <span className="block text-[9px] uppercase font-normal opacity-70" dir="ltr">Total</span></th></tr>
                                                    </thead>
                                                    <tbody className="text-sm font-bold">
                                                        <tr className="border-b border-slate-100 hover:bg-slate-50"><td className="p-4 text-right bg-slate-50 text-emerald-700">إجمالي التوزيع (مستثمر خارجي) <span className="block text-[9px] uppercase font-normal" dir="ltr">Total Distribution (External Investor)</span></td>{profitDistribution.investorShare.map((v, i) => <td key={i} className="p-3 text-emerald-700">{formatDisplay(v)}</td>)}<td className="p-3 font-black bg-[#fdf8f1] border-r-2 border-[#BD8F3F] text-emerald-800">{formatDisplay((profitDistribution.investorShare || []).reduce((a, b) => a + safeNum(b), 0))}</td></tr>
                                                        <tr className="border-b border-slate-100 hover:bg-slate-50"><td className="p-4 text-right bg-slate-50 text-[#BD8F3F]">إجمالي التوزيع (مطور بيلد وايز) <span className="block text-[9px] uppercase font-normal" dir="ltr">Total Distribution (Build Wise)</span></td>{profitDistribution.bwShare.map((v, i) => <td key={i} className="p-3 text-[#BD8F3F]">{formatDisplay(v)}</td>)}<td className="p-3 font-black bg-[#fdf8f1] border-r-2 border-[#BD8F3F] text-[#8C3B19]">{formatDisplay((profitDistribution.bwShare || []).reduce((a, b) => a + safeNum(b), 0))}</td></tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                )}

                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
